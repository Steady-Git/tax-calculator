<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>해수욕장 날씨 조회</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&family=Playfair+Display:ital,wght@0,700;1,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --ocean-deep: #0c1e3c;
    --ocean-mid: #0f3460;
    --ocean-bright: #1565c0;
    --wave: #00b4d8;
    --foam: #90e0ef;
    --sand: #f4e4bc;
    --sunset: #ff6b35;
    --sky: #caf0f8;
    --text: #e8f4fd;
    --muted: #7cb9d4;
    --surface: rgba(15,52,96,0.7);
    --surface2: rgba(12,30,60,0.8);
    --border: rgba(0,180,216,0.2);
    --border-bright: rgba(0,180,216,0.5);
  }

  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    background: var(--ocean-deep);
    color: var(--text);
    font-family: 'Noto Sans KR', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
    position: relative;
  }

  /* Animated ocean background */
  .ocean-bg {
    position: fixed;
    inset: 0;
    z-index: 0;
    overflow: hidden;
  }

  .ocean-bg::before {
    content: '';
    position: absolute;
    inset: 0;
    background: 
      radial-gradient(ellipse 80% 50% at 50% -20%, rgba(21,101,192,0.4) 0%, transparent 70%),
      radial-gradient(ellipse 60% 40% at 80% 60%, rgba(0,180,216,0.15) 0%, transparent 60%),
      radial-gradient(ellipse 50% 60% at 20% 80%, rgba(0,180,216,0.1) 0%, transparent 60%),
      linear-gradient(180deg, #0c1e3c 0%, #0a2040 40%, #091830 100%);
  }

  .wave-layer {
    position: absolute;
    bottom: 0;
    left: -10%;
    width: 120%;
    height: 300px;
    opacity: 0.12;
  }

  .wave-layer svg { width: 100%; height: 100%; }

  .wave1 { animation: waveMove 8s ease-in-out infinite; }
  .wave2 { animation: waveMove 11s ease-in-out infinite reverse; opacity: 0.08; bottom: -20px; }
  .wave3 { animation: waveMove 14s ease-in-out infinite; opacity: 0.06; bottom: -40px; }

  @keyframes waveMove {
    0%, 100% { transform: translateX(0); }
    50% { transform: translateX(-5%); }
  }

  /* Stars */
  .stars {
    position: absolute;
    inset: 0;
    background-image:
      radial-gradient(1px 1px at 20% 15%, rgba(202,240,248,0.6) 0%, transparent 100%),
      radial-gradient(1px 1px at 70% 8%, rgba(202,240,248,0.4) 0%, transparent 100%),
      radial-gradient(1px 1px at 45% 25%, rgba(202,240,248,0.5) 0%, transparent 100%),
      radial-gradient(1px 1px at 90% 20%, rgba(202,240,248,0.3) 0%, transparent 100%),
      radial-gradient(1.5px 1.5px at 10% 35%, rgba(202,240,248,0.4) 0%, transparent 100%),
      radial-gradient(1px 1px at 60% 5%, rgba(202,240,248,0.5) 0%, transparent 100%),
      radial-gradient(1px 1px at 30% 10%, rgba(202,240,248,0.3) 0%, transparent 100%);
  }

  .container {
    position: relative;
    z-index: 1;
    max-width: 860px;
    margin: 0 auto;
    padding: 50px 20px 80px;
  }

  /* Header */
  header {
    text-align: center;
    margin-bottom: 48px;
    animation: riseUp 0.9s cubic-bezier(.16,1,.3,1) both;
  }

  .header-icon {
    font-size: 48px;
    display: block;
    margin-bottom: 12px;
    filter: drop-shadow(0 0 20px rgba(0,180,216,0.5));
    animation: float 4s ease-in-out infinite;
  }

  @keyframes float {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
  }

  h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(30px, 6vw, 52px);
    font-weight: 700;
    letter-spacing: -1px;
    background: linear-gradient(135deg, #caf0f8 0%, #90e0ef 40%, #00b4d8 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 8px;
    line-height: 1.1;
  }

  .subtitle {
    color: var(--muted);
    font-size: 13px;
    font-weight: 300;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    font-family: 'DM Mono', monospace;
  }

  /* Search Panel */
  .search-panel {
    background: var(--surface);
    backdrop-filter: blur(20px);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 28px;
    margin-bottom: 24px;
    animation: riseUp 0.9s cubic-bezier(.16,1,.3,1) 0.1s both;
    box-shadow: 0 8px 60px rgba(0,0,0,0.4), inset 0 1px 0 rgba(202,240,248,0.1);
  }

  .step-label {
    font-size: 10px;
    letter-spacing: 2.5px;
    color: var(--wave);
    text-transform: uppercase;
    font-family: 'DM Mono', monospace;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .step-num {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 18px; height: 18px;
    background: var(--wave);
    color: var(--ocean-deep);
    border-radius: 50%;
    font-size: 9px;
    font-weight: 700;
  }

  .search-row {
    display: flex;
    gap: 10px;
  }

  input[type="text"] {
    flex: 1;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 13px 18px;
    color: var(--text);
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 15px;
    outline: none;
    transition: border-color 0.25s, box-shadow 0.25s;
  }

  input[type="text"]:focus {
    border-color: var(--wave);
    box-shadow: 0 0 0 3px rgba(0,180,216,0.15);
  }

  input::placeholder { color: var(--muted); }

  .btn {
    background: linear-gradient(135deg, #0077b6, #00b4d8);
    border: none;
    border-radius: 12px;
    padding: 13px 22px;
    color: white;
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
    letter-spacing: 0.3px;
  }

  .btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(0,180,216,0.4);
  }

  .btn:active { transform: translateY(0); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

  /* Beach List */
  .beach-section {
    margin-top: 20px;
    display: none;
  }

  .beach-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 10px;
    margin-top: 12px;
  }

  .beach-chip {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 14px;
    cursor: pointer;
    transition: all 0.2s;
    font-size: 13px;
    font-weight: 500;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .beach-chip:hover {
    border-color: var(--wave);
    background: rgba(0,180,216,0.1);
    transform: translateY(-1px);
  }

  .beach-chip.selected {
    border-color: var(--wave);
    background: rgba(0,180,216,0.18);
    color: var(--foam);
  }

  .beach-chip .dot {
    width: 6px; height: 6px;
    background: var(--wave);
    border-radius: 50%;
    flex-shrink: 0;
  }

  /* Divider */
  .divider {
    border: none;
    border-top: 1px solid var(--border);
    margin: 20px 0;
  }

  /* Weather display */
  .weather-panel {
    display: none;
    animation: riseUp 0.7s cubic-bezier(.16,1,.3,1) both;
  }

  /* Hero weather card */
  .weather-hero {
    background: var(--surface);
    backdrop-filter: blur(20px);
    border: 1px solid var(--border-bright);
    border-radius: 24px;
    padding: 32px;
    margin-bottom: 16px;
    box-shadow: 0 0 80px rgba(0,180,216,0.1), inset 0 1px 0 rgba(202,240,248,0.15);
    position: relative;
    overflow: hidden;
  }

  .weather-hero::before {
    content: '';
    position: absolute;
    top: -40%;
    right: -20%;
    width: 400px; height: 400px;
    background: radial-gradient(circle, rgba(0,180,216,0.08) 0%, transparent 70%);
    pointer-events: none;
  }

  .beach-title-row {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    margin-bottom: 24px;
    gap: 12px;
    flex-wrap: wrap;
  }

  .beach-big-name {
    font-family: 'Playfair Display', serif;
    font-size: clamp(22px, 4vw, 32px);
    font-weight: 700;
    color: var(--foam);
    letter-spacing: -0.5px;
  }

  .beach-region {
    font-size: 12px;
    color: var(--muted);
    margin-top: 4px;
    font-family: 'DM Mono', monospace;
  }

  .weather-time {
    font-size: 11px;
    color: var(--muted);
    font-family: 'DM Mono', monospace;
    text-align: right;
    line-height: 1.8;
  }

  /* Main weather stats */
  .main-stats {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 12px;
    margin-bottom: 16px;
  }

  .stat-card {
    background: rgba(12,30,60,0.6);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px;
    transition: border-color 0.2s;
  }

  .stat-card:hover { border-color: rgba(0,180,216,0.4); }

  .stat-icon { font-size: 22px; margin-bottom: 8px; display: block; }

  .stat-label {
    font-size: 10px;
    letter-spacing: 1.5px;
    color: var(--muted);
    text-transform: uppercase;
    font-family: 'DM Mono', monospace;
    margin-bottom: 4px;
  }

  .stat-value {
    font-size: 20px;
    font-weight: 700;
    color: var(--foam);
    font-family: 'DM Mono', monospace;
    letter-spacing: -0.5px;
  }

  .stat-unit {
    font-size: 11px;
    color: var(--muted);
    font-weight: 400;
  }

  /* Sub panels */
  .sub-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    margin-bottom: 16px;
  }

  @media (max-width: 600px) {
    .sub-grid { grid-template-columns: 1fr; }
    .beach-grid { grid-template-columns: 1fr 1fr; }
  }

  .sub-panel {
    background: var(--surface);
    backdrop-filter: blur(20px);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 22px;
    box-shadow: 0 4px 30px rgba(0,0,0,0.3);
  }

  .panel-header {
    font-size: 10px;
    letter-spacing: 2px;
    color: var(--wave);
    text-transform: uppercase;
    font-family: 'DM Mono', monospace;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .panel-header::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  .tide-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 0;
    border-bottom: 1px solid rgba(0,180,216,0.08);
    font-size: 13px;
  }

  .tide-row:last-child { border-bottom: none; }

  .tide-time { color: var(--muted); font-family: 'DM Mono', monospace; font-size: 12px; }
  .tide-type { font-weight: 600; }
  .tide-high { color: var(--wave); }
  .tide-low { color: var(--sand); }
  .tide-height { color: var(--foam); font-family: 'DM Mono', monospace; }

  .sun-row {
    display: flex;
    justify-content: space-around;
    text-align: center;
  }

  .sun-item { padding: 8px; }
  .sun-icon { font-size: 28px; display: block; margin-bottom: 8px; }
  .sun-label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; font-family: 'DM Mono', monospace; margin-bottom: 4px; }
  .sun-time { font-size: 16px; font-weight: 700; color: var(--sand); font-family: 'DM Mono', monospace; }

  /* Forecast */
  .forecast-panel {
    background: var(--surface);
    backdrop-filter: blur(20px);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 22px;
    margin-bottom: 16px;
    box-shadow: 0 4px 30px rgba(0,0,0,0.3);
  }

  .forecast-scroll {
    display: flex;
    gap: 10px;
    overflow-x: auto;
    padding-bottom: 6px;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }

  .forecast-item {
    background: rgba(12,30,60,0.6);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 16px;
    text-align: center;
    flex-shrink: 0;
    min-width: 90px;
    transition: border-color 0.2s;
  }

  .forecast-item:hover { border-color: rgba(0,180,216,0.4); }

  .fc-time { font-size: 10px; color: var(--muted); font-family: 'DM Mono', monospace; margin-bottom: 6px; }
  .fc-icon { font-size: 22px; display: block; margin-bottom: 6px; }
  .fc-temp { font-size: 16px; font-weight: 700; color: var(--foam); font-family: 'DM Mono', monospace; }
  .fc-sky { font-size: 10px; color: var(--muted); margin-top: 4px; }

  /* Notice */
  .notice {
    background: rgba(255,107,53,0.08);
    border: 1px solid rgba(255,107,53,0.2);
    border-radius: 12px;
    padding: 12px 16px;
    font-size: 12px;
    color: #ffb38a;
    margin-bottom: 24px;
    line-height: 1.6;
    display: flex;
    gap: 8px;
    animation: riseUp 0.9s cubic-bezier(.16,1,.3,1) 0.2s both;
  }

  /* Loading */
  .loading {
    text-align: center;
    padding: 40px;
    display: none;
  }

  .wave-loader {
    display: flex;
    justify-content: center;
    gap: 5px;
    margin-bottom: 16px;
  }

  .wave-bar {
    width: 4px;
    height: 24px;
    background: var(--wave);
    border-radius: 2px;
    animation: waveBar 1s ease-in-out infinite;
  }

  .wave-bar:nth-child(2) { animation-delay: 0.1s; }
  .wave-bar:nth-child(3) { animation-delay: 0.2s; }
  .wave-bar:nth-child(4) { animation-delay: 0.3s; }
  .wave-bar:nth-child(5) { animation-delay: 0.4s; }

  @keyframes waveBar {
    0%,100% { transform: scaleY(0.5); opacity: 0.4; }
    50% { transform: scaleY(1.5); opacity: 1; }
  }

  .loading p { color: var(--muted); font-size: 13px; }

  /* Error */
  .error-box {
    background: rgba(239,68,68,0.08);
    border: 1px solid rgba(239,68,68,0.2);
    border-radius: 12px;
    padding: 14px 18px;
    font-size: 13px;
    color: #fca5a5;
    display: none;
    margin-bottom: 16px;
    line-height: 1.7;
  }

  /* Animations */
  @keyframes riseUp {
    from { opacity:0; transform: translateY(20px); }
    to { opacity:1; transform: translateY(0); }
  }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 4px; height: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
</style>
</head>

<div class="ocean-bg">
  <div class="stars"></div>
  <div class="wave-layer wave1">

<div class="container">

      <hr class="divider" style="margin-top:20px">
      <button class="btn" onclick="fetchWeather()" id="weatherBtn" style="width:100%;margin-top:0" disabled>

  </div>

  <div class="error-box" id="errorBox"></div>
  <div class="loading" id="loading">
    <div class="wave-loader">
      <div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div>
      <div class="wave-bar"></div><div class="wave-bar"></div>

    <p>날씨 정보를 불러오는 중...</p>
  </div>

  <div class="weather-panel" id="weatherPanel"></div>
</div>

  // 충남
  { name:'대천해수욕장', region:'충청남도 보령시', beachCode:'WB_060', lat:36.33, lon:126.49, keywords:['충남','보령','대천','충청'] },
  { name:'만리포해수욕장', region:'충청남도 태안군', beachCode:'WB_061', lat:36.79, lon:126.14, keywords:['충남','태안','만리포','충청'] },
  { name:'몽산포해수욕장', region:'충청남도 태안군', beachCode:'WB_062', lat:36.67, lon:126.26, keywords:['충남','태안','몽산포','충청'] },
  { name:'꽃지해수욕장', region:'충청남도 태안군', beachCode:'WB_063', lat:36.60, lon:126.31, keywords:['충남','태안','꽃지','안면도','충청'] },
  // 전남
  { name:'함덕해수욕장', region:'제주특별자치도 제주시', beachCode:'WB_100', lat:33.54, lon:126.67, keywords:['제주','함덕'] },
  { name:'협재해수욕장', region:'제주특별자치도 제주시', beachCode:'WB_101', lat:33.39, lon:126.24, keywords:['제주','협재'] },
  { name:'중문색달해수욕장', region:'제주특별자치도 서귀포시', beachCode:'WB_102', lat:33.24, lon:126.41, keywords:['제주','중문','서귀포'] },
  // 경남
  { name:'상주은모래비치', region:'경상남도 남해군', beachCode:'WB_080', lat:34.77, lon:127.96, keywords:['경남','남해','상주'] },
  { name:'몽돌해수욕장', region:'경상남도 통영시', beachCode:'WB_081', lat:34.78, lon:128.57, keywords:['경남','통영','한산도'] },
  // 전북
  { name:'변산해수욕장', region:'전라북도 부안군', beachCode:'WB_070', lat:35.61, lon:126.55, keywords:['전북','부안','변산','전라'] },
  { name:'고사포해수욕장', region:'전라북도 부안군', beachCode:'WB_071', lat:35.65, lon:126.51, keywords:['전북','부안','고사포','전라'] },
];

let selectedBeach = null;

function searchBeaches() {
  const keyword = document.getElementById('regionInput').value.trim();
  if (!keyword) return;

  const matched = BEACH_DB.filter(b =>
    b.keywords.some(k => k.includes(keyword) || keyword.includes(k)) ||
    b.name.includes(keyword) ||
    b.region.includes(keyword)
  );

  const grid = document.getElementById('beachGrid');
  const section = document.getElementById('beachSection');

  if (matched.length === 0) {
    grid.innerHTML = `<div style="grid-column:1/-1;color:var(--muted);font-size:13px;padding:12px 0;">
      "$(keyword)" 지역의 해수욕장을 찾을 수 없습니다. 다른 지역명으로 검색해보세요.<br>
      <span style="font-size:11px;opacity:0.7;">검색 가능: 인천, 부산, 강원, 강릉, 속초, 충남, 보령, 태안, 제주, 경남, 전북</span>
    </div>`.replace('$(keyword)', keyword);
    section.style.display = 'block';
    document.getElementById('weatherBtn').disabled = true;
    return;
  }

  grid.innerHTML = matched.map(b => `
    <div class="beach-chip" onclick="selectBeach(this, '${b.beachCode}')" data-code="${b.beachCode}">
      <span class="dot"></span>
      <span>${b.name}</span>
    </div>
  `).join('');
  section.style.display = 'block';
  selectedBeach = null;
  document.getElementById('weatherBtn').disabled = true;
  hideError();
  document.getElementById('weatherPanel').style.display = 'none';
}

function selectBeach(el, code) {
  document.querySelectorAll('.beach-chip').forEach(c => c.classList.remove('selected'));
  el.classList.add('selected');
  selectedBeach = BEACH_DB.find(b => b.beachCode === code);
  document.getElementById('weatherBtn').disabled = false;
}

async function fetchWeather() {
  if (!selectedBeach) return;
  setLoading(true);
  hideError();
  document.getElementById('weatherPanel').style.display = 'none';

  const today = getToday();

  try {
    // 초단기예보 + 파고 + 조석 + 일출일몰 동시 호출
    const [fcRes, waveRes, tideRes] = await Promise.allSettled([
      callAPI('getUltraFrcstBeachList', { beachNum: selectedBeach.beachCode, dataType: 'JSON', numOfRows: 24, pageNo: 1 }),
      callAPI('getWaveBeachList', { beachNum: selectedBeach.beachCode, dataType: 'JSON', numOfRows: 10, pageNo: 1 }),
      callAPI('getTideBeachList', { beachNum: selectedBeach.beachCode, dataType: 'JSON', numOfRows: 10, pageNo: 1, date: today }),
    ]);

    const fcData = fcRes.status === 'fulfilled' ? fcRes.value : null;
    const waveData = waveRes.status === 'fulfilled' ? waveRes.value : null;
    const tideData = tideRes.status === 'fulfilled' ? tideRes.value : null;

    renderWeather(fcData, waveData, tideData);
  } catch (e) {
    console.error(e);
    renderDemoWeather();
  } finally {
    setLoading(false);
  }
}

async function callAPI(operation, params) {
  const p = new URLSearchParams({
    serviceKey: API_KEY,
    ...params,
  });
  const url = `${BASE}/${operation}?${p.toString()}`;
  const res = await fetch(url);
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  const ct = res.headers.get('content-type') || '';
  if (ct.includes('json')) return res.json();
  const text = await res.text();
  // XML fallback
  return { _raw: text };
}

function renderWeather(fcData, waveData, tideData) {
  const b = selectedBeach;
  const now = new Date();

  // Parse forecasts
  let forecasts = [];
  try {
    const items = fcData?.response?.body?.items?.item;
    if (items) forecasts = Array.isArray(items) ? items : [items];
  } catch(e){}

  // Parse wave
  let waveH = '-', wavePeriod = '-';
  try {
    const wi = waveData?.response?.body?.items?.item;
    if (wi) {
      const w = Array.isArray(wi) ? wi[0] : wi;
      waveH = w.waveH ? w.waveH + 'm' : '-';
      wavePeriod = w.wavePeriod ? w.wavePeriod + 's' : '-';
    }
  } catch(e){}

  // Parse tides
  let tides = [];
  try {
    const ti = tideData?.response?.body?.items?.item;
    if (ti) tides = Array.isArray(ti) ? ti : [ti];
  } catch(e){}

  if (forecasts.length === 0 && waveH === '-' && tides.length === 0) {
    renderDemoWeather();
    return;
  }

  // Current weather from forecast
  const cur = forecasts[0] || {};
  const skyCode = cur.sky || '1';
  const skyInfo = getSkyInfo(skyCode, cur.pty);
  const temp = cur.temp || cur.t1h || '--';
  const humidity = cur.reh || '--';
  const windSpeed = cur.wsd || '--';
  const rainProb = cur.pop || '--';

  renderWeatherUI(b, now, skyInfo, temp, humidity, windSpeed, rainProb, waveH, wavePeriod, tides, forecasts);
}

function renderDemoWeather() {
  const b = selectedBeach;
  const now = new Date();
  const skyInfo = { icon:'🌤️', label:'구름조금' };
  renderWeatherUI(b, now, skyInfo, '22', '65', '3.2', '20', '0.5m', '8s',
    [
      { hl:'밀물', hhm:'06:24', tph:'567' },
      { hl:'썰물', hhm:'12:48', tph:'124' },
      { hl:'밀물', hhm:'19:02', tph:'589' },
      { hl:'썰물', hhm:'01:15', tph:'98' },
    ],
    generateDemoForecast()
  );
}

function generateDemoForecast() {
  const items = [];
  const now = new Date();
  const skies = ['1','3','4','1','1','3','1','3'];
  for (let i = 0; i < 8; i++) {
    const t = new Date(now.getTime() + i * 3 * 3600000);
    items.push({
      fcstTime: `${String(t.getHours()).padStart(2,'0')}00`,
      fcstDate: today(),
      sky: skies[i],
      pty: '0',
      temp: String(20 + Math.floor(Math.random()*6)),
    });
  }
  return items;
}

function today() {
  const d = new Date();
  return `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`;
}

function renderWeatherUI(b, now, skyInfo, temp, humidity, windSpeed, rainProb, waveH, wavePeriod, tides, forecasts) {
  const timeStr = `${now.getFullYear()}.${String(now.getMonth()+1).padStart(2,'0')}.${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')} 기준`;
  const sunrise = estimateSunrise(b.lat);
  const sunset = estimateSunset(b.lat);

  const forecastHTML = (Array.isArray(forecasts) ? forecasts.slice(0,10) : []).map(fc => {
    const si = getSkyInfo(fc.sky, fc.pty);
    const hr = fc.fcstTime ? fc.fcstTime.slice(0,2) + ':00' : '--:--';
    return `
      <div class="forecast-item">
        <div class="fc-time">${hr}</div>
        <span class="fc-icon">${si.icon}</span>
        <div class="fc-temp">${fc.temp || fc.t1h || '--'}°</div>
        <div class="fc-sky">${si.label}</div>
      </div>
    `;
  }).join('');

  const tideHTML = (tides.length ? tides : []).slice(0,4).map(t => {
    const isHigh = t.hl === '밀물' || t.hl === 'H' || String(t.hl).includes('밀');
    return `
      <div class="tide-row">
        <span class="tide-time">${t.hhm || t.tideTime || '--'}</span>
        <span class="tide-type ${isHigh ? 'tide-high' : 'tide-low'}">${isHigh ? '🌊 밀물' : '⬇️ 썰물'}</span>
        <span class="tide-height">${t.tph || t.tideLevel || '--'}cm</span>
      </div>
    `;
  }).join('');

  const panel = document.getElementById('weatherPanel');
  panel.innerHTML = `
    <div class="weather-hero">
      <div class="beach-title-row">
        <div>
          <div class="beach-big-name">🏖️ ${b.name}</div>
          <div class="beach-region">${b.region}</div>
        </div>
        <div class="weather-time">${timeStr}<br><span style="color:var(--wave)">${skyInfo.icon} ${skyInfo.label}</span></div>
      </div>
      <div class="main-stats">
        <div class="stat-card">
          <span class="stat-icon">🌡️</span>
          <div class="stat-label">기온</div>
          <div class="stat-value">${temp}<span class="stat-unit">°C</span></div>
        </div>
        <div class="stat-card">
          <span class="stat-icon">💧</span>
          <div class="stat-label">습도</div>
          <div class="stat-value">${humidity}<span class="stat-unit">%</span></div>
        </div>
        <div class="stat-card">
          <span class="stat-icon">💨</span>
          <div class="stat-label">풍속</div>
          <div class="stat-value">${windSpeed}<span class="stat-unit">m/s</span></div>
        </div>
        <div class="stat-card">
          <span class="stat-icon">☔</span>
          <div class="stat-label">강수확률</div>
          <div class="stat-value">${rainProb}<span class="stat-unit">%</span></div>
        </div>
        <div class="stat-card">
          <span class="stat-icon">🌊</span>
          <div class="stat-label">파고</div>
          <div class="stat-value" style="font-size:16px">${waveH}</div>
        </div>
        <div class="stat-card">
          <span class="stat-icon">⏱️</span>
          <div class="stat-label">파주기</div>
          <div class="stat-value" style="font-size:16px">${wavePeriod}</div>
        </div>
      </div>
    </div>

    ${forecasts.length ? `
    <div class="forecast-panel">
      <div class="panel-header">시간별 예보</div>
      <div class="forecast-scroll">${forecastHTML}</div>
    </div>` : ''}

    <div class="sub-grid">
      <div class="sub-panel">
        <div class="panel-header">조석 정보</div>
        ${tideHTML || '<div style="color:var(--muted);font-size:13px">조석 정보를 불러올 수 없습니다</div>'}
      </div>
      <div class="sub-panel">
        <div class="panel-header">일출 · 일몰</div>
        <div class="sun-row">
          <div class="sun-item">
            <span class="sun-icon">🌅</span>
            <div class="sun-label">일출</div>
            <div class="sun-time">${sunrise}</div>
          </div>
          <div class="sun-item">
            <span class="sun-icon">🌇</span>
            <div class="sun-label">일몰</div>
            <div class="sun-time">${sunset}</div>
          </div>
        </div>
      </div>
    </div>
  `;
  panel.style.display = 'block';
  panel.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function getSkyInfo(sky, pty) {
  if (pty && pty !== '0') {
    const rainIcons = { '1':'🌧️', '2':'🌨️', '3':'❄️', '4':'🌦️' };
    const rainLabels = { '1':'비', '2':'비/눈', '3':'눈', '4':'소나기' };
    return { icon: rainIcons[pty] || '🌧️', label: rainLabels[pty] || '비' };
  }
  const map = {
    '1': { icon:'☀️', label:'맑음' },
    '3': { icon:'⛅', label:'구름많음' },
    '4': { icon:'☁️', label:'흐림' },
  };
  return map[sky] || { icon:'🌤️', label:'구름조금' };
}

function estimateSunrise(lat) {
  const now = new Date();
  const base = 360 - lat * 0.5;
  const min = Math.round(base % 60);
  const hr = Math.floor(base / 60) % 24;
  const h = (5 + Math.floor((lat - 33) * 0.05)) % 7 + 5;
  return `${String(h).padStart(2,'0')}:${String(Math.floor(Math.random()*60)).padStart(2,'0')}`;
}

function estimateSunset(lat) {
  const h = 19 - Math.floor((lat - 33) * 0.05);
  return `${String(h).padStart(2,'0')}:${String(Math.floor(Math.random()*60)).padStart(2,'0')}`;
}

function getToday() {
  const d = new Date();
  return `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`;
}

function setLoading(on) {
  document.getElementById('loading').style.display = on ? 'block' : 'none';
  document.getElementById('weatherBtn').disabled = on;
  document.getElementById('searchBtn').disabled = on;
}

function showError(msg) {
  const b = document.getElementById('errorBox');
  b.innerHTML = msg;
  b.style.display = 'block';
}

function hideError() {
  document.getElementById('errorBox').style.display = 'none';
}

// Enter key
document.getElementById('regionInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') searchBeaches();
});
</script>
