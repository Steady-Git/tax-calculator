<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>부동산 공시가격 조회</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700&family=IBM+Plex+Mono:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#10131a;
  --surf:#161c28;
  --card:#1c2436;
  --border:#232d42;
  --border2:#2c3a55;
  --txt:#e4e9f0;
  --muted:#6b7a99;
  --muted2:#8a9ab8;
  --blue:#4a90d9;
  --blue-l:rgba(74,144,217,.12);
  --green:#2ecc71;
  --green-l:rgba(46,204,113,.10);
  --amber:#f59e0b;
  --amber-l:rgba(245,158,11,.10);
  --red:#e74c3c;
  --red-l:rgba(231,76,60,.10);
  --violet:#9b59b6;
  --violet-l:rgba(155,89,182,.10);
  --mono:'IBM Plex Mono',monospace;
  --sans:'Noto Sans KR',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--txt);font-family:var(--sans);min-height:100vh;font-size:14px;}

/* animated bg */
body::before{
  content:'';position:fixed;inset:0;
  background:
    radial-gradient(ellipse 70% 40% at 15% 10%,rgba(74,144,217,.07) 0%,transparent 60%),
    radial-gradient(ellipse 50% 30% at 85% 80%,rgba(46,204,113,.05) 0%,transparent 50%);
  pointer-events:none;z-index:0;
}

.page{max-width:1060px;margin:0 auto;padding:44px 20px 100px;position:relative;z-index:1;}

/* ── HEADER ── */
.hdr{margin-bottom:36px;}
.hdr-top{display:flex;align-items:center;gap:14px;margin-bottom:6px;}
.hdr-icon{
  width:48px;height:48px;
  background:linear-gradient(135deg,#1a3a5c,#0d2340);
  border:1px solid rgba(74,144,217,.35);
  border-radius:14px;display:flex;align-items:center;justify-content:center;
  font-size:24px;box-shadow:0 0 24px rgba(74,144,217,.15);
}
.hdr h1{font-size:22px;font-weight:700;letter-spacing:-.5px;}
.hdr-sub{font-family:var(--mono);font-size:11px;color:var(--muted);padding-left:62px;line-height:1.8;}

/* ── SEARCH ── */
.search-wrap{
  background:var(--surf);border:1px solid var(--border);
  border-radius:14px;padding:22px;margin-bottom:18px;
}
.flabel{font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:1px;margin-bottom:9px;}
.srow{display:flex;gap:8px;}
.sinput{
  flex:1;background:var(--card);border:1.5px solid var(--border2);
  border-radius:8px;padding:12px 16px;
  font-family:var(--sans);font-size:15px;color:var(--txt);outline:none;
  transition:border-color .15s;
}
.sinput:focus{border-color:var(--blue);}
.sinput::placeholder{color:var(--muted);}

.btn{
  padding:11px 20px;border-radius:8px;
  font-family:var(--sans);font-size:13px;font-weight:600;
  cursor:pointer;border:1.5px solid transparent;
  transition:all .15s;display:flex;align-items:center;gap:6px;white-space:nowrap;
}
.btn-p{background:var(--blue);color:#fff;}
.btn-p:hover{background:#3a7bc8;transform:translateY(-1px);}
.btn-p:disabled{opacity:.4;cursor:not-allowed;transform:none;}
.btn-g{background:transparent;color:var(--muted);border-color:var(--border2);}
.btn-g:hover{border-color:var(--blue);color:var(--blue);}

/* addr results */
.addr-list{margin-top:10px;display:flex;flex-direction:column;gap:6px;}
.addr-item{
  background:var(--card);border:1.5px solid var(--border);
  border-radius:8px;padding:12px 14px;cursor:pointer;
  transition:all .15s;display:flex;gap:10px;align-items:flex-start;
}
.addr-item:hover{border-color:var(--blue);background:var(--blue-l);}
.addr-badge{
  flex-shrink:0;font-size:10px;font-family:var(--mono);
  background:var(--blue-l);color:var(--blue);
  border-radius:3px;padding:2px 7px;margin-top:1px;
}
.addr-road{font-size:13px;font-weight:500;line-height:1.4;}
.addr-jibun{font-size:11px;color:var(--muted);margin-top:2px;}

/* chip */
.chip{
  display:flex;align-items:flex-start;gap:10px;
  background:var(--blue-l);border:1.5px solid rgba(74,144,217,.25);
  border-radius:8px;padding:12px 16px;margin-bottom:18px;
  animation:fu .25s ease;
}
.chip-addr{color:var(--blue);font-weight:600;font-size:13px;}
.chip-meta{font-size:11px;color:var(--muted);font-family:var(--mono);margin-top:3px;}

/* ── YEAR SELECTOR ── */
.year-bar{
  display:flex;align-items:center;gap:10px;
  margin-bottom:22px;flex-wrap:wrap;
}
.year-label{font-family:var(--mono);font-size:11px;color:var(--muted);}
.year-btn{
  padding:5px 14px;border-radius:20px;
  border:1.5px solid var(--border2);
  background:transparent;color:var(--muted2);
  font-family:var(--mono);font-size:12px;cursor:pointer;
  transition:all .15s;
}
.year-btn:hover{border-color:var(--blue);color:var(--blue);}
.year-btn.active{background:var(--blue);border-color:var(--blue);color:#fff;}

/* ── PRICE PANELS ── */
.panels-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;margin-bottom:18px;}

.price-panel{
  background:var(--surf);border:1px solid var(--border);
  border-radius:14px;overflow:hidden;
  display:flex;flex-direction:column;
}
.pp-head{
  padding:14px 18px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:10px;
}
.pp-icon{
  width:34px;height:34px;border-radius:9px;
  display:flex;align-items:center;justify-content:center;font-size:17px;
  flex-shrink:0;
}
.pp-ttl{font-size:13px;font-weight:700;}
.pp-sub{font-size:10px;color:var(--muted);font-family:var(--mono);margin-top:2px;}
.pp-body{padding:18px;flex:1;}

/* individual price colors */
.panel-land   .pp-head{background:rgba(46,204,113,.06);}
.panel-land   .pp-icon{background:var(--green-l);}
.panel-house  .pp-head{background:rgba(245,158,11,.06);}
.panel-house  .pp-icon{background:var(--amber-l);}
.panel-apt    .pp-head{background:rgba(74,144,217,.06);}
.panel-apt    .pp-icon{background:var(--blue-l);}

/* price display */
.price-main{
  font-size:26px;font-weight:700;letter-spacing:-.5px;
  margin-bottom:6px;line-height:1.2;
}
.price-unit{font-size:13px;font-weight:400;color:var(--muted);margin-left:4px;}
.price-won{font-size:13px;color:var(--muted2);margin-bottom:14px;}

.kv2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.kv2-item{}
.kv2-label{font-size:10px;color:var(--muted);font-family:var(--mono);margin-bottom:3px;}
.kv2-val{font-size:12px;font-weight:500;}

/* tag */
.tag{
  display:inline-flex;align-items:center;gap:4px;
  padding:3px 10px;border-radius:20px;
  font-size:11px;font-weight:600;
}
.tag-g{background:var(--green-l);color:var(--green);}
.tag-a{background:var(--amber-l);color:var(--amber);}
.tag-b{background:var(--blue-l);color:var(--blue);}
.tag-v{background:var(--violet-l);color:var(--violet);}

/* history table */
.hist-section{
  background:var(--surf);border:1px solid var(--border);
  border-radius:14px;overflow:hidden;
  margin-bottom:16px;
}
.hist-head{
  padding:14px 20px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
  background:var(--card);
}
.hist-ttl{font-size:13px;font-weight:700;display:flex;align-items:center;gap:8px;}
.tbl-wrap{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:12px;}
th{
  background:var(--card);padding:9px 14px;text-align:left;
  font-size:10px;font-family:var(--mono);color:var(--muted);
  border-bottom:1.5px solid var(--border);white-space:nowrap;
}
td{padding:10px 14px;border-bottom:1px solid var(--border);vertical-align:middle;}
tr:last-child td{border-bottom:none;}
tr:hover td{background:rgba(255,255,255,.02);}
.mono{font-family:var(--mono);font-size:11px;}
.price-cell{font-weight:600;font-family:var(--mono);}

/* loading / empty / err */
.loading{
  display:flex;flex-direction:column;align-items:center;
  justify-content:center;padding:48px 20px;gap:12px;
  color:var(--muted);font-size:12px;font-family:var(--mono);
}
.spinner{
  width:26px;height:26px;border:2px solid var(--border2);
  border-top-color:var(--blue);border-radius:50%;
  animation:spin .7s linear infinite;
}
.empty{text-align:center;padding:40px 20px;color:var(--muted);}
.empty .ei{font-size:32px;margin-bottom:10px;}
.empty p{font-size:12px;line-height:1.8;}
.errbox{
  background:var(--red-l);border:1.5px solid rgba(231,76,60,.25);
  border-radius:8px;padding:14px 16px;color:var(--red);
  font-size:12px;display:flex;gap:8px;align-items:flex-start;margin:14px 0;
}

/* start hint */
.hint{
  background:var(--surf);border:1px solid var(--border);
  border-radius:14px;padding:56px 24px;text-align:center;color:var(--muted);
}
.hint .hi{font-size:48px;margin-bottom:16px;}
.hint p{font-size:13px;line-height:2;max-width:400px;margin:0 auto;}

/* animations */
@keyframes fu{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
@keyframes spin{to{transform:rotate(360deg)}}
.anim{animation:fu .3s ease;}

/* responsive */
@media(max-width:750px){
  .panels-grid{grid-template-columns:1fr;}
  .srow{flex-wrap:wrap;}
}
@media(max-width:500px){.year-btn{padding:4px 10px;font-size:11px;}}
</style>
</head>
<body>
<div class="page">

  <!-- Header -->
  <div class="hdr">
    <div class="hdr-top">
      <div class="hdr-icon">🏡</div>
      <h1>부동산 공시가격 조회</h1>
    </div>
    <div class="hdr-sub">
      개별공시지가 · 개별주택가격 · 공동주택(아파트)공시가격 &nbsp;|&nbsp; 국토교통부 OpenAPI
    </div>
  </div>

  <!-- Search -->
  <div class="search-wrap">
    <div class="flabel">// 주소 검색 — 도로명 또는 지번 입력</div>
    <div class="srow">
      <input class="sinput" id="addrInput"
        placeholder="예: 서울 강남구 테헤란로 152  또는  서울 강남구 역삼동 737"
        onkeydown="if(event.key==='Enter') searchAddr()">
      <button class="btn btn-p" id="sbtn" onclick="searchAddr()">🔍 검색</button>
      <button class="btn btn-g" onclick="resetAll()">↺</button>
    </div>
    <div id="addrResults"></div>
  </div>

  <!-- Chip -->
  <div id="addrChip" style="display:none"></div>

  <!-- Main area -->
  <div id="main">
    <div class="hint">
      <div class="hi">🏘</div>
      <p>
        주소를 검색하고 선택하면<br>
        <strong style="color:var(--txt)">개별공시지가 · 개별주택가격 · 공동주택 공시가격</strong>을<br>
        연도별로 한번에 조회합니다.
      </p>
    </div>
  </div>

</div>

<script>
/* ══════════════════════════════════════════
   API KEYS (from screenshot)
══════════════════════════════════════════ */
const JUSO_KEY   = "U01TX0FVVEgyMDI2MDQwMTEwMjQxNTExNzgzMzQ=";

// 스크린샷의 개발키 (UUID 형식)
const KEY_LAND   = "06C4CFEA-F5ED-3263-80EA-C12518CDD1EA";  // 개별공시지가 조회
const KEY_HOUSE  = "4E18A931-8B32-36D9-A882-0EC227EFBD20";  // 개별주택가격 조회
const KEY_APT    = "173F7105-4395-367F-A856-3CE03141A176";  // 공동주택공시가격 조회

const JUSO_BASE  = "https://business.juso.go.kr/addrlink/addrLinkApi.do";

// 현재년도 기준으로 최근 5년
const CUR_YEAR   = new Date().getFullYear();
const YEARS      = Array.from({length:6},(_,i)=>CUR_YEAR-i);

let cur   = null;   // selected address
let selYr = CUR_YEAR; // selected year

/* ══════════════════════════════════════════
   ADDRESS SEARCH
══════════════════════════════════════════ */
async function searchAddr(){
  const q = document.getElementById('addrInput').value.trim();
  if(!q){alert('주소를 입력하세요');return;}
  const el = document.getElementById('addrResults');
  el.innerHTML = `<div style="padding:12px;font-family:var(--mono);font-size:12px;color:var(--muted)">⟳ 검색 중...</div>`;

  try{
    const url=`${JUSO_BASE}?confmKey=${JUSO_KEY}&currentPage=1&countPerPage=10&keyword=${encodeURIComponent(q)}&resultType=json`;
    const r=await fetch(url);
    const j=await r.json();
    const list=j?.results?.juso??[];
    if(!list.length){el.innerHTML=`<div style="padding:12px;color:var(--muted);font-size:13px">검색 결과가 없습니다.</div>`;return;}

    el.innerHTML=`<div class="addr-list">${list.map(x=>{
      const info=JSON.stringify({
        sigunguCd:x.admCd.slice(0,5),
        bjdongCd:x.admCd.slice(5,10),
        platGbCd:x.mtYn==="1"?"1":"0",
        bun:x.lnbrMnnm.padStart(4,'0'),
        ji:x.lnbrSlno.padStart(4,'0'),
        pnu:x.admCd.slice(0,5)+x.admCd.slice(5,10)+(x.mtYn==="1"?"2":"1")+x.lnbrMnnm.padStart(4,'0')+x.lnbrSlno.padStart(4,'0'),
        road:x.roadAddr,
        jibun:x.jibunAddr,
        bdNm:x.bdNm||'',
        bdKdcd:x.bdKdcd,
      });
      return `<div class="addr-item" onclick='pick(${info})'>
        <span class="addr-badge">${x.bdKdcd==="1"?"공동주택":"일반건물"}</span>
        <div>
          <div class="addr-road">${x.roadAddr}${x.bdNm?` <span style="color:var(--amber)">(${x.bdNm})</span>`:''}</div>
          <div class="addr-jibun">지번: ${x.jibunAddr}</div>
        </div>
      </div>`;
    }).join('')}</div>`;
  }catch(e){
    el.innerHTML=`<div class="errbox">⚠️ 주소 검색 오류: ${e.message}</div>`;
  }
}

/* ══════════════════════════════════════════
   ADDRESS SELECTED
══════════════════════════════════════════ */
function pick(info){
  cur=info;
  document.getElementById('addrInput').value=info.road;
  document.getElementById('addrResults').innerHTML='';

  const chip=document.getElementById('addrChip');
  chip.style.display='flex';
  chip.className='chip anim';
  chip.innerHTML=`<span>📍</span>
    <div>
      <div class="chip-addr">${info.road}${info.bdNm?` <span style="color:var(--amber);font-size:12px">(${info.bdNm})</span>`:''}</div>
      <div class="chip-meta">지번: ${info.jibun} &nbsp;|&nbsp; PNU: ${info.pnu} &nbsp;|&nbsp; 유형: ${info.bdKdcd==='1'?'공동주택':'일반건물'}</div>
    </div>`;

  renderMain();
}

/* ══════════════════════════════════════════
   RENDER MAIN
══════════════════════════════════════════ */
function renderMain(){
  const mainEl=document.getElementById('main');
  mainEl.innerHTML=`
    <!-- Year selector -->
    <div class="year-bar">
      <span class="year-label">// 공시기준년도</span>
      ${YEARS.map(y=>`<button class="year-btn${y===selYr?' active':''}" onclick="setYear(${y})">${y}</button>`).join('')}
    </div>

    <!-- 3 price panels -->
    <div class="panels-grid anim">
      <div class="price-panel panel-land">
        <div class="pp-head"><div class="pp-icon">🌿</div><div><div class="pp-ttl">개별공시지가</div><div class="pp-sub">토지 단위면적당 가격</div></div></div>
        <div class="pp-body" id="pnl-land"><div class="loading"><div class="spinner"></div><span>조회 중...</span></div></div>
      </div>
      <div class="price-panel panel-house">
        <div class="pp-head"><div class="pp-icon">🏠</div><div><div class="pp-ttl">개별주택가격</div><div class="pp-sub">단독·다가구 공시가격</div></div></div>
        <div class="pp-body" id="pnl-house"><div class="loading"><div class="spinner"></div><span>조회 중...</span></div></div>
      </div>
      <div class="price-panel panel-apt">
        <div class="pp-head"><div class="pp-icon">🏢</div><div><div class="pp-ttl">공동주택공시가격</div><div class="pp-sub">아파트·연립·다세대</div></div></div>
        <div class="pp-body" id="pnl-apt"><div class="loading"><div class="spinner"></div><span>조회 중...</span></div></div>
      </div>
    </div>

    <!-- History section -->
    <div id="hist-section"></div>
  `;

  loadAll();
}

function setYear(y){
  selYr=y;
  document.querySelectorAll('.year-btn').forEach(b=>{
    b.classList.toggle('active', parseInt(b.textContent)===y);
  });
  loadAll();
}

/* ══════════════════════════════════════════
   LOAD ALL 3 APIs
══════════════════════════════════════════ */
async function loadAll(){
  const {sigunguCd,bjdongCd,bun,ji,pnu,bdKdcd}=cur;

  // Reset panels
  ['land','house','apt'].forEach(id=>{
    document.getElementById(`pnl-${id}`).innerHTML=
      `<div class="loading"><div class="spinner"></div><span>조회 중...</span></div>`;
  });
  document.getElementById('hist-section').innerHTML='';

  // Fire in parallel
  await Promise.all([
    loadLand(sigunguCd,bjdongCd,bun,ji),
    loadHouse(sigunguCd,bjdongCd,bun,ji),
    loadApt(sigunguCd,bjdongCd,bun,ji),
  ]);

  // History (연도별 집계)
  loadHistory(sigunguCd,bjdongCd,bun,ji);
}

/* ──────────────────────────
   1. 개별공시지가
────────────────────────── */
async function loadLand(sigunguCd,bjdongCd,bun,ji){
  const el=document.getElementById('pnl-land');
  try{
    const p=new URLSearchParams({
      serviceKey:KEY_LAND,
      ldCode:sigunguCd+bjdongCd,
      regstrSeCode:'1',
      stdrYear:selYr,
      numOfRows:10,pageNo:1,
      _type:'json',
    });
    const res=await fetch(`https://apis.data.go.kr/1611000/nsdi/IndvdLandPriceService/wfs/getIndvdLandPriceWFS?${p}`);
    if(!res.ok)throw new Error(`HTTP ${res.status}`);
    const json=await res.json();
    const items=[].concat(json?.response?.body?.items?.item??[]);

    // 번/지 필터링
    let matched=items.filter(it=>{
      const b=String(it.bun||'').replace(/^0+/,'')||'0';
      const j=String(it.ji||'').replace(/^0+/,'')||'0';
      const qb=String(parseInt(bun,10));
      const qj=String(parseInt(ji,10));
      return b===qb&&j===qj;
    });
    if(!matched.length&&items.length) matched=items; // fallback: show all

    if(!matched.length){
      el.innerHTML=`<div class="empty"><div class="ei">🌿</div><p>${selYr}년 개별공시지가<br>데이터가 없습니다.</p></div>`;
      return;
    }

    const it=matched[0];
    const price=it.indvdLandPrice??it.pblntfPclnd??0;
    const won=Number(price);
    el.innerHTML=`
      <div class="price-main" style="color:var(--green)">${won.toLocaleString()}<span class="price-unit">원/㎡</span></div>
      <div class="price-won">= ${(won*3.3058).toLocaleString(undefined,{maximumFractionDigits:0})} 원/평</div>
      <div class="kv2">
        <div class="kv2-item"><div class="kv2-label">공시기준일</div><div class="kv2-val">${selYr}.01.01</div></div>
        <div class="kv2-item"><div class="kv2-label">지번</div><div class="kv2-val mono">${parseInt(bun,10)}-${parseInt(ji,10)}</div></div>
        <div class="kv2-item"><div class="kv2-label">지목</div><div class="kv2-val">${it.lndcgrCodeNm||'—'}</div></div>
        <div class="kv2-item"><div class="kv2-label">면적(㎡)</div><div class="kv2-val mono">${it.lndpclAr?Number(it.lndpclAr).toLocaleString():'—'}</div></div>
      </div>`;
  }catch(e){
    el.innerHTML=`<div class="errbox">⚠️ ${e.message}</div>`;
  }
}

/* ──────────────────────────
   2. 개별주택가격
────────────────────────── */
async function loadHouse(sigunguCd,bjdongCd,bun,ji){
  const el=document.getElementById('pnl-house');
  try{
    const p=new URLSearchParams({
      serviceKey:KEY_HOUSE,
      ldCode:sigunguCd+bjdongCd,
      stdrYear:selYr,
      numOfRows:20,pageNo:1,
      _type:'json',
    });
    const res=await fetch(`https://apis.data.go.kr/1611000/nsdi/IndvHousPriceService/wfs/getIndvHousPriceWFS?${p}`);
    if(!res.ok)throw new Error(`HTTP ${res.status}`);
    const json=await res.json();
    const items=[].concat(json?.response?.body?.items?.item??[]);

    let matched=items.filter(it=>{
      const b=String(it.bun||'').replace(/^0+/,'')||'0';
      const j=String(it.ji||'').replace(/^0+/,'')||'0';
      return b===String(parseInt(bun,10))&&j===String(parseInt(ji,10));
    });
    if(!matched.length&&items.length) matched=items;

    if(!matched.length){
      el.innerHTML=`<div class="empty"><div class="ei">🏠</div><p>${selYr}년 개별주택가격<br>데이터가 없습니다.<br><span style="font-size:11px">공동주택 탭을 확인하세요.</span></p></div>`;
      return;
    }

    const it=matched[0];
    const price=it.housePc??it.pblntfPc??0;
    const won=Number(price)*10000;
    el.innerHTML=`
      <div class="price-main" style="color:var(--amber)">${Number(it.housePc??it.pblntfPc??0).toLocaleString()}<span class="price-unit">만원</span></div>
      <div class="price-won">= ${won.toLocaleString()} 원</div>
      <div class="kv2">
        <div class="kv2-item"><div class="kv2-label">공시기준일</div><div class="kv2-val">${selYr}.01.01</div></div>
        <div class="kv2-item"><div class="kv2-label">지번</div><div class="kv2-val mono">${parseInt(bun,10)}-${parseInt(ji,10)}</div></div>
        <div class="kv2-item"><div class="kv2-label">건물연면적</div><div class="kv2-val">${it.totFlrAr?Number(it.totFlrAr).toLocaleString()+' ㎡':'—'}</div></div>
        <div class="kv2-item"><div class="kv2-label">건축년도</div><div class="kv2-val">${it.bldYr||'—'}년</div></div>
      </div>`;
  }catch(e){
    el.innerHTML=`<div class="errbox">⚠️ ${e.message}</div>`;
  }
}

/* ──────────────────────────
   3. 공동주택공시가격
────────────────────────── */
async function loadApt(sigunguCd,bjdongCd,bun,ji){
  const el=document.getElementById('pnl-apt');
  try{
    const p=new URLSearchParams({
      serviceKey:KEY_APT,
      ldCode:sigunguCd+bjdongCd,
      stdrYear:selYr,
      numOfRows:50,pageNo:1,
      _type:'json',
    });
    const res=await fetch(`https://apis.data.go.kr/1611000/nsdi/AptPriceService/wfs/getAptPriceWFS?${p}`);
    if(!res.ok)throw new Error(`HTTP ${res.status}`);
    const json=await res.json();
    const items=[].concat(json?.response?.body?.items?.item??[]);

    let matched=items.filter(it=>{
      const b=String(it.bun||'').replace(/^0+/,'')||'0';
      const j=String(it.ji||'').replace(/^0+/,'')||'0';
      return b===String(parseInt(bun,10))&&j===String(parseInt(ji,10));
    });
    if(!matched.length&&items.length) matched=items.slice(0,5);

    if(!matched.length){
      el.innerHTML=`<div class="empty"><div class="ei">🏢</div><p>${selYr}년 공동주택공시가격<br>데이터가 없습니다.<br><span style="font-size:11px">단독주택은 개별주택가격을 확인하세요.</span></p></div>`;
      return;
    }

    if(matched.length===1){
      const it=matched[0];
      const price=Number(it.pblntfPc??0);
      el.innerHTML=`
        <div class="price-main" style="color:var(--blue)">${price.toLocaleString()}<span class="price-unit">만원</span></div>
        <div class="price-won">= ${(price*10000).toLocaleString()} 원</div>
        <div class="kv2">
          <div class="kv2-item"><div class="kv2-label">단지명</div><div class="kv2-val">${it.kaptName||it.aptNm||'—'}</div></div>
          <div class="kv2-item"><div class="kv2-label">동/호</div><div class="kv2-val mono">${it.dongNm||'—'}동 ${it.hoNm||'—'}호</div></div>
          <div class="kv2-item"><div class="kv2-label">전용면적</div><div class="kv2-val">${it.prvuseAr?Number(it.prvuseAr).toLocaleString()+' ㎡':'—'}</div></div>
          <div class="kv2-item"><div class="kv2-label">공시기준일</div><div class="kv2-val">${selYr}.01.01</div></div>
        </div>`;
    }else{
      // 여러 호 존재 → 목록
      const rows=matched.slice(0,8).map(it=>`<tr>
        <td class="mono">${it.dongNm||'—'}</td>
        <td class="mono">${it.hoNm||'—'}</td>
        <td>${it.prvuseAr?Number(it.prvuseAr).toLocaleString()+' ㎡':'—'}</td>
        <td class="price-cell" style="color:var(--blue)">${Number(it.pblntfPc||0).toLocaleString()} 만원</td>
      </tr>`).join('');
      el.innerHTML=`
        <p style="font-size:11px;color:var(--muted);margin-bottom:10px">여러 호가 검색되었습니다 (${matched.length}건)</p>
        <div class="tbl-wrap"><table>
          <thead><tr><th>동</th><th>호</th><th>전용면적</th><th>공시가격</th></tr></thead>
          <tbody>${rows}</tbody>
        </table></div>`;
    }
  }catch(e){
    el.innerHTML=`<div class="errbox">⚠️ ${e.message}</div>`;
  }
}

/* ──────────────────────────
   연도별 이력 (개별공시지가 기준)
────────────────────────── */
async function loadHistory(sigunguCd,bjdongCd,bun,ji){
  const el=document.getElementById('hist-section');
  el.innerHTML=`<div class="loading"><div class="spinner"></div><span>연도별 공시가격 이력 조회 중...</span></div>`;

  try{
    const results=await Promise.allSettled(YEARS.map(async y=>{
      const p=new URLSearchParams({
        serviceKey:KEY_LAND,
        ldCode:sigunguCd+bjdongCd,
        regstrSeCode:'1',
        stdrYear:y,
        numOfRows:10,pageNo:1,_type:'json',
      });
      const r=await fetch(`https://apis.data.go.kr/1611000/nsdi/IndvdLandPriceService/wfs/getIndvdLandPriceWFS?${p}`);
      const j=await r.json();
      const items=[].concat(j?.response?.body?.items?.item??[]);
      const filtered=items.filter(it=>{
        const b=String(it.bun||'').replace(/^0+/,'')||'0';
        const jj=String(it.ji||'').replace(/^0+/,'')||'0';
        return b===String(parseInt(bun,10))&&jj===String(parseInt(ji,10));
      });
      const it=filtered[0]||items[0];
      return {year:y,price:it?Number(it.indvdLandPrice??it.pblntfPclnd??0):null};
    }));

    const rows=results.map((r,i)=>{
      const {year,price}=r.status==='fulfilled'?r.value:{year:YEARS[i],price:null};
      const prev=results[i+1]?.status==='fulfilled'?results[i+1].value.price:null;
      let change='';
      if(price&&prev){
        const pct=((price-prev)/prev*100).toFixed(1);
        const up=price>prev;
        change=`<span style="color:${up?'var(--green)':'var(--red)');font-size:11px">${up?'▲':'▼'} ${Math.abs(pct)}%</span>`;
      }
      return `<tr${year===selYr?' style="background:rgba(74,144,217,.06)"':''}>
        <td class="mono" style="color:${year===selYr?'var(--blue)':'inherit'};font-weight:${year===selYr?'600':'400'}">${year}</td>
        <td class="price-cell" style="color:var(--green)">${price!=null?price.toLocaleString()+' 원/㎡':'—'}</td>
        <td>${price!=null?(price*3.3058).toLocaleString(undefined,{maximumFractionDigits:0})+' 원/평':'—'}</td>
        <td>${change}</td>
      </tr>`;
    }).join('');

    el.innerHTML=`
      <div class="hist-section anim">
        <div class="hist-head">
          <div class="hist-ttl">📊 연도별 개별공시지가 이력</div>
          <span class="tag tag-g">최근 ${YEARS.length}년</span>
        </div>
        <div class="tbl-wrap"><table>
          <thead><tr><th>기준년도</th><th>공시지가 (원/㎡)</th><th>평당 환산</th><th>전년비</th></tr></thead>
          <tbody>${rows}</tbody>
        </table></div>
      </div>`;
  }catch(e){
    el.innerHTML=`<div class="errbox">⚠️ 이력 조회 오류: ${e.message}</div>`;
  }
}
