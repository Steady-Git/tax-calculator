<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>공동주택 정보 조회</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0e1a;
    --surface: #111827;
    --surface2: #1a2235;
    --accent: #3b82f6;
    --accent2: #60a5fa;
    --gold: #f59e0b;
    --text: #e2e8f0;
    --muted: #64748b;
    --border: #1e293b;
    --success: #10b981;
    --error: #ef4444;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans KR', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Grid background */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(59,130,246,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(59,130,246,0.04) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  .container {
    position: relative;
    z-index: 1;
    max-width: 900px;
    margin: 0 auto;
    padding: 40px 20px 80px;
  }

  /* Header */
  header {
    text-align: center;
    margin-bottom: 48px;
    animation: fadeDown 0.7s ease;
  }

  .badge {
    display: inline-block;
    background: rgba(59,130,246,0.15);
    border: 1px solid rgba(59,130,246,0.3);
    color: var(--accent2);
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 2px;
    padding: 4px 14px;
    border-radius: 20px;
    margin-bottom: 16px;
    font-family: 'DM Mono', monospace;
  }

  h1 {
    font-size: clamp(28px, 5vw, 44px);
    font-weight: 900;
    letter-spacing: -1.5px;
    line-height: 1.1;
    background: linear-gradient(135deg, #e2e8f0 0%, #60a5fa 50%, #3b82f6 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 10px;
  }

  .subtitle {
    color: var(--muted);
    font-size: 14px;
    font-weight: 300;
    letter-spacing: 0.3px;
  }

  /* Search Panel */
  .search-panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 28px;
    margin-bottom: 28px;
    animation: fadeUp 0.7s ease 0.1s both;
    box-shadow: 0 0 60px rgba(59,130,246,0.05);
  }

  .panel-title {
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 2px;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 20px;
    font-family: 'DM Mono', monospace;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .panel-title::before {
    content: '';
    display: inline-block;
    width: 6px; height: 6px;
    background: var(--accent);
    border-radius: 50%;
  }

  .form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
    margin-bottom: 20px;
  }

  @media (max-width: 600px) {
    .form-grid { grid-template-columns: 1fr; }
  }

  .form-group {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .form-group.full { grid-column: 1 / -1; }

  label {
    font-size: 12px;
    font-weight: 500;
    color: var(--muted);
    letter-spacing: 0.5px;
  }

  input, select {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 14px;
    color: var(--text);
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 14px;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  input:focus, select:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(59,130,246,0.15);
  }

  input::placeholder { color: var(--muted); }

  select option { background: var(--surface2); }

  .search-btn {
    width: 100%;
    background: linear-gradient(135deg, #2563eb, #3b82f6);
    border: none;
    border-radius: 10px;
    padding: 13px;
    color: white;
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: 0.5px;
    position: relative;
    overflow: hidden;
  }

  .search-btn:hover {
    transform: translateY(-1px);
    box-shadow: 0 8px 24px rgba(59,130,246,0.35);
  }

  .search-btn:active { transform: translateY(0); }

  .search-btn:disabled {
    opacity: 0.6;
    cursor: not-allowed;
    transform: none;
  }

  /* Notice */
  .notice {
    background: rgba(245,158,11,0.08);
    border: 1px solid rgba(245,158,11,0.2);
    border-radius: 10px;
    padding: 12px 16px;
    font-size: 12px;
    color: #fbbf24;
    margin-bottom: 28px;
    display: flex;
    gap: 8px;
    align-items: flex-start;
    line-height: 1.6;
    animation: fadeUp 0.7s ease 0.2s both;
  }

  /* Loading */
  .loading {
    text-align: center;
    padding: 60px 0;
    display: none;
  }

  .spinner {
    width: 40px; height: 40px;
    border: 3px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 16px;
  }

  .loading-text {
    color: var(--muted);
    font-size: 13px;
  }

  /* Error */
  .error-box {
    background: rgba(239,68,68,0.08);
    border: 1px solid rgba(239,68,68,0.25);
    border-radius: 10px;
    padding: 16px 20px;
    color: #fca5a5;
    font-size: 13px;
    display: none;
    margin-bottom: 20px;
    line-height: 1.6;
  }

  /* Results */
  .results-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
  }

  .results-count {
    font-size: 12px;
    color: var(--muted);
    font-family: 'DM Mono', monospace;
  }

  .results-count span {
    color: var(--accent2);
    font-weight: 500;
  }

  /* Card */
  .apt-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    margin-bottom: 16px;
    overflow: hidden;
    animation: fadeUp 0.4s ease both;
    transition: border-color 0.2s, transform 0.2s;
  }

  .apt-card:hover {
    border-color: rgba(59,130,246,0.3);
    transform: translateY(-2px);
    box-shadow: 0 12px 40px rgba(0,0,0,0.3);
  }

  .card-header {
    padding: 18px 22px;
    background: var(--surface2);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
  }

  .apt-name {
    font-size: 17px;
    font-weight: 700;
    letter-spacing: -0.5px;
    margin-bottom: 4px;
  }

  .apt-address {
    font-size: 12px;
    color: var(--muted);
  }

  .apt-tag {
    background: rgba(59,130,246,0.12);
    border: 1px solid rgba(59,130,246,0.2);
    color: var(--accent2);
    font-size: 10px;
    font-weight: 500;
    padding: 3px 10px;
    border-radius: 20px;
    white-space: nowrap;
    font-family: 'DM Mono', monospace;
  }

  .card-body {
    padding: 18px 22px;
  }

  .info-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 12px;
  }

  .info-item {
    background: var(--surface2);
    border-radius: 8px;
    padding: 11px 14px;
  }

  .info-label {
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 0.5px;
    margin-bottom: 5px;
    font-family: 'DM Mono', monospace;
    text-transform: uppercase;
  }

  .info-value {
    font-size: 13px;
    font-weight: 500;
    color: var(--text);
    word-break: keep-all;
  }

  .info-value.highlight {
    color: var(--accent2);
    font-family: 'DM Mono', monospace;
    font-size: 14px;
  }

  /* Empty state */
  .empty-state {
    text-align: center;
    padding: 60px 0;
    color: var(--muted);
    display: none;
  }

  .empty-icon {
    font-size: 40px;
    margin-bottom: 12px;
    opacity: 0.4;
  }

  /* Pagination */
  .pagination {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 8px;
    margin-top: 28px;
  }

  .page-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    padding: 8px 16px;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.15s;
  }

  .page-btn:hover { border-color: var(--accent); color: var(--accent2); }
  .page-btn.active { background: var(--accent); border-color: var(--accent); color: white; }
  .page-btn:disabled { opacity: 0.3; cursor: not-allowed; }

  .page-info {
    color: var(--muted);
    font-size: 12px;
    font-family: 'DM Mono', monospace;
    padding: 0 8px;
  }

  /* Animations */
  @keyframes fadeDown {
    from { opacity: 0; transform: translateY(-20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
</style>
</head>
<body>
<div class="container">
  <header>
    <div class="badge">MOLIT OPEN API</div>
    <h1>공동주택<br>정보 조회</h1>
    <p class="subtitle">국토교통부 공동주택 기본정보 제공 서비스</p>
  </header>

  <div class="notice">
    <span>⚠️</span>
    <span>이 앱은 국토교통부 공공데이터 API를 사용합니다. CORS 정책으로 인해 브라우저에서 직접 API 호출이 제한될 수 있습니다. 실제 서비스 환경에서는 백엔드 프록시 서버를 통해 호출하는 것을 권장합니다. 아래는 API 연동 데모입니다.</span>
  </div>

  <div class="search-panel">
    <div class="panel-title">검색 조건</div>
    <div class="form-grid">
      <div class="form-group">
        <label>시도</label>
        <select id="sido" onchange="updateSigungu()">
          <option value="">시도 선택</option>
          <option value="서울특별시">서울특별시</option>
          <option value="부산광역시">부산광역시</option>
          <option value="대구광역시">대구광역시</option>
          <option value="인천광역시">인천광역시</option>
          <option value="광주광역시">광주광역시</option>
          <option value="대전광역시">대전광역시</option>
          <option value="울산광역시">울산광역시</option>
          <option value="세종특별자치시">세종특별자치시</option>
          <option value="경기도">경기도</option>
          <option value="강원도">강원도</option>
          <option value="충청북도">충청북도</option>
          <option value="충청남도">충청남도</option>
          <option value="전라북도">전라북도</option>
          <option value="전라남도">전라남도</option>
          <option value="경상북도">경상북도</option>
          <option value="경상남도">경상남도</option>
          <option value="제주특별자치도">제주특별자치도</option>
        </select>
      </div>
      <div class="form-group">
        <label>단지명 (선택)</label>
        <input type="text" id="kaptName" placeholder="예: 래미안, 힐스테이트">
      </div>
      <div class="form-group">
        <label>법정동 코드 (선택)</label>
        <input type="text" id="bjdCode" placeholder="10자리 코드 (예: 1100000000)">
      </div>
      <div class="form-group">
        <label>페이지당 결과 수</label>
        <select id="numRows">
          <option value="10">10건</option>
          <option value="20" selected>20건</option>
          <option value="50">50건</option>
        </select>
      </div>
    </div>
    <button class="search-btn" onclick="search(1)" id="searchBtn">
      🔍 조회하기
    </button>
  </div>

  <div class="error-box" id="errorBox"></div>
  <div class="loading" id="loading">
    <div class="spinner"></div>
    <p class="loading-text">공동주택 정보를 불러오는 중...</p>
  </div>

  <div id="resultsArea" style="display:none">
    <div class="results-header">
      <div class="results-count">총 <span id="totalCount">0</span>건 조회됨</div>
      <div class="results-count" id="pageInfo"></div>
    </div>
    <div id="cardList"></div>
    <div class="pagination" id="pagination"></div>
  </div>

  <div class="empty-state" id="emptyState">
    <div class="empty-icon">🏢</div>
    <p>검색 결과가 없습니다</p>
  </div>
</div>

<script>
const API_KEY = 'dc8294cd0177c5d51b45be29652fb691c4b18e055f22c87b0967ca1a78c7df0a';
const BASE_URL = 'https://apis.data.go.kr/1613000/AptBasisInfoServiceV4/getAphusBassInfo';

let currentPage = 1;
let totalCount = 0;
let numRows = 20;

async function search(page = 1) {
  const sido = document.getElementById('sido').value;
  const kaptName = document.getElementById('kaptName').value.trim();
  const bjdCode = document.getElementById('bjdCode').value.trim();
  numRows = parseInt(document.getElementById('numRows').value);

  if (!sido && !kaptName && !bjdCode) {
    showError('시도를 선택하거나 단지명 또는 법정동 코드를 입력해주세요.');
    return;
  }

  currentPage = page;
  setLoading(true);
  hideError();

  const params = new URLSearchParams({
    serviceKey: API_KEY,
    pageNo: page,
    numOfRows: numRows,
    _type: 'json',
  });

  if (sido) params.append('sido', sido);
  if (kaptName) params.append('kaptName', kaptName);
  if (bjdCode) params.append('bjdCode', bjdCode);

  const url = `${BASE_URL}?${params.toString()}`;

  try {
    const res = await fetch(url);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();

    const body = data?.response?.body;
    if (!body) throw new Error('응답 데이터 형식이 올바르지 않습니다.');

    const items = body.items?.item;
    totalCount = body.totalCount || 0;

    document.getElementById('totalCount').textContent = totalCount.toLocaleString();
    document.getElementById('pageInfo').textContent =
      `${page} / ${Math.ceil(totalCount / numRows)} 페이지`;

    if (!items || totalCount === 0) {
      showEmpty();
    } else {
      const list = Array.isArray(items) ? items : [items];
      renderCards(list);
      renderPagination(page, Math.ceil(totalCount / numRows));
      document.getElementById('resultsArea').style.display = 'block';
      document.getElementById('emptyState').style.display = 'none';
    }
  } catch (err) {
    console.error(err);
    showError(
      `API 호출 중 오류가 발생했습니다.<br>` +
      `<strong>오류:</strong> ${err.message}<br><br>` +
      `<strong>참고:</strong> CORS 정책으로 인해 브라우저에서 직접 API를 호출할 수 없을 수 있습니다. ` +
      `실제 서비스를 위해서는 서버 사이드 프록시가 필요합니다.<br><br>` +
      `아래는 사용 가능한 API 정보입니다:<br>` +
      `• End Point: https://apis.data.go.kr/1613000/AptBasisInfoServiceV4<br>` +
      `• 오퍼레이션: getAphusBassInfo (기본정보조회), getAphusDetailInfo (상세정보조회)`
    );
    showDemoData();
  } finally {
    setLoading(false);
  }
}

function showDemoData() {
  const demo = [
    {
      kaptName: '래미안 퍼스티지',
      doroJuso: '서울특별시 서초구 반포동 1-1',
      kaptCode: 'A11680001',
      hoCnt: '2444',
      dongCnt: '34',
      buildYear: '2009',
      heatMethodNm: '지역난방',
      manageMthdNm: '위탁관리',
      totalFloor: '35',
    },
    {
      kaptName: '아크로리버파크',
      doroJuso: '서울특별시 서초구 반포동 1-3',
      kaptCode: 'A11680003',
      hoCnt: '1612',
      dongCnt: '30',
      buildYear: '2016',
      heatMethodNm: '지역난방',
      manageMthdNm: '위탁관리',
      totalFloor: '38',
    },
    {
      kaptName: '힐스테이트 광교',
      doroJuso: '경기도 수원시 영통구 이의동 948',
      kaptCode: 'B31110001',
      hoCnt: '1082',
      dongCnt: '12',
      buildYear: '2019',
      heatMethodNm: '개별난방',
      manageMthdNm: '위탁관리',
      totalFloor: '29',
    },
  ];

  document.getElementById('totalCount').textContent = '3 (데모)';
  document.getElementById('pageInfo').textContent = '1 / 1 페이지 (데모)';
  renderCards(demo);
  document.getElementById('resultsArea').style.display = 'block';
  document.getElementById('emptyState').style.display = 'none';
  document.getElementById('pagination').innerHTML = '';
}

function renderCards(items) {
  const list = document.getElementById('cardList');
  list.innerHTML = '';
  items.forEach((item, i) => {
    const card = document.createElement('div');
    card.className = 'apt-card';
    card.style.animationDelay = `${i * 0.05}s`;
    card.innerHTML = `
      <div class="card-header">
        <div>
          <div class="apt-name">${item.kaptName || '-'}</div>
          <div class="apt-address">${item.doroJuso || item.bjdJuso || '-'}</div>
        </div>
        <div class="apt-tag">${item.kaptCode || '-'}</div>
      </div>
      <div class="card-body">
        <div class="info-grid">
          ${infoItem('세대수', item.hoCnt ? parseInt(item.hoCnt).toLocaleString() + '세대' : '-', true)}
          ${infoItem('동수', item.dongCnt ? item.dongCnt + '동' : '-')}
          ${infoItem('준공연도', item.buildYear || '-', true)}
          ${infoItem('최고층', item.totalFloor ? item.totalFloor + '층' : '-')}
          ${infoItem('난방방식', item.heatMethodNm || '-')}
          ${infoItem('관리방식', item.manageMthdNm || '-')}
          ${infoItem('건축구조', item.strctCdNm || '-')}
          ${infoItem('주차대수', item.parkingCnt ? parseInt(item.parkingCnt).toLocaleString() + '대' : '-')}
        </div>
      </div>
    `;
    list.appendChild(card);
  });
}

function infoItem(label, value, highlight = false) {
  return `
    <div class="info-item">
      <div class="info-label">${label}</div>
      <div class="info-value ${highlight ? 'highlight' : ''}">${value}</div>
    </div>
  `;
}

function renderPagination(current, total) {
  const pg = document.getElementById('pagination');
  pg.innerHTML = '';
  if (total <= 1) return;

  const prev = document.createElement('button');
  prev.className = 'page-btn';
  prev.textContent = '← 이전';
  prev.disabled = current === 1;
  prev.onclick = () => search(current - 1);
  pg.appendChild(prev);

  const start = Math.max(1, current - 2);
  const end = Math.min(total, start + 4);
  for (let i = start; i <= end; i++) {
    const btn = document.createElement('button');
    btn.className = 'page-btn' + (i === current ? ' active' : '');
    btn.textContent = i;
    btn.onclick = (() => { const p = i; return () => search(p); })();
    pg.appendChild(btn);
  }

  const next = document.createElement('button');
  next.className = 'page-btn';
  next.textContent = '다음 →';
  next.disabled = current === total;
  next.onclick = () => search(current + 1);
  pg.appendChild(next);
}

function setLoading(on) {
  document.getElementById('loading').style.display = on ? 'block' : 'none';
  document.getElementById('searchBtn').disabled = on;
  if (on) {
    document.getElementById('resultsArea').style.display = 'none';
    document.getElementById('emptyState').style.display = 'none';
  }
}

function showError(msg) {
  const box = document.getElementById('errorBox');
  box.innerHTML = msg;
  box.style.display = 'block';
}

function hideError() {
  document.getElementById('errorBox').style.display = 'none';
}

function showEmpty() {
  document.getElementById('resultsArea').style.display = 'none';
  document.getElementById('emptyState').style.display = 'block';
}

function updateSigungu() { /* 필요시 시군구 연동 가능 */ }

// Enter key
document.addEventListener('keydown', e => {
  if (e.key === 'Enter') search(1);
});
</script>
</body>
</html>
