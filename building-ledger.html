<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>건축물대장 조회</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0f1117;
  --surface: #161b27;
  --card: #1c2333;
  --border: #252d3d;
  --border2: #2e3a50;
  --accent: #4f9cf9;
  --accent2: #6ee7b7;
  --accent3: #f59e0b;
  --red: #f87171;
  --text: #e2e8f0;
  --muted: #64748b;
  --muted2: #8899aa;
  --mono: 'JetBrains Mono', monospace;
  --sans: 'Noto Sans KR', sans-serif;
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--sans);
  min-height: 100vh;
  font-size: 14px;
}

/* grid bg */
body::after {
  content:'';
  position:fixed;
  inset:0;
  background:
    radial-gradient(ellipse 80% 50% at 20% 10%, rgba(79,156,249,0.06) 0%, transparent 60%),
    radial-gradient(ellipse 60% 40% at 80% 80%, rgba(110,231,183,0.04) 0%, transparent 50%);
  pointer-events:none;
  z-index:0;
}

.wrap {
  max-width: 1000px;
  margin: 0 auto;
  padding: 40px 20px 80px;
  position: relative;
  z-index: 1;
}

/* ── Header ── */
.header {
  margin-bottom: 36px;
}

.header-top {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-bottom: 8px;
}

.header-icon {
  width: 46px; height: 46px;
  background: linear-gradient(135deg, #1e3a5f, #0d2340);
  border: 1px solid rgba(79,156,249,0.3);
  border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  font-size: 22px;
  box-shadow: 0 0 20px rgba(79,156,249,0.15);
}

h1 {
  font-size: 22px;
  font-weight: 700;
  letter-spacing: -0.5px;
}

.header-sub {
  font-size: 12px;
  color: var(--muted);
  font-family: var(--mono);
  padding-left: 60px;
}

/* ── Search box ── */
.search-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 24px;
  margin-bottom: 20px;
}

.search-label {
  font-size: 11px;
  color: var(--muted);
  font-family: var(--mono);
  letter-spacing: 1px;
  margin-bottom: 10px;
}

.search-row {
  display: flex;
  gap: 10px;
}

.search-input {
  flex: 1;
  background: var(--card);
  border: 1px solid var(--border2);
  border-radius: 10px;
  padding: 13px 16px;
  color: var(--text);
  font-family: var(--sans);
  font-size: 15px;
  outline: none;
  transition: border-color 0.2s;
}

.search-input:focus { border-color: var(--accent); }
.search-input::placeholder { color: var(--muted); }

.btn {
  padding: 12px 22px;
  border-radius: 10px;
  font-family: var(--sans);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  border: none;
  transition: all 0.15s;
  white-space: nowrap;
  display: flex;
  align-items: center;
  gap: 6px;
}

.btn-primary {
  background: var(--accent);
  color: #fff;
}

.btn-primary:hover { background: #3b87e8; transform: translateY(-1px); }
.btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

.btn-ghost {
  background: transparent;
  border: 1px solid var(--border2);
  color: var(--muted2);
}

.btn-ghost:hover { border-color: var(--accent); color: var(--accent); }

/* address hints */
.addr-list {
  margin-top: 10px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.addr-item {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 11px 14px;
  cursor: pointer;
  transition: all 0.15s;
  display: flex;
  align-items: flex-start;
  gap: 10px;
}

.addr-item:hover {
  border-color: var(--accent);
  background: rgba(79,156,249,0.06);
}

.addr-road {
  font-size: 13px;
  font-weight: 500;
  color: var(--text);
  line-height: 1.4;
}

.addr-jibun {
  font-size: 11px;
  color: var(--muted);
  margin-top: 2px;
}

.addr-badge {
  flex-shrink: 0;
  font-size: 10px;
  background: rgba(79,156,249,0.15);
  color: var(--accent);
  border-radius: 4px;
  padding: 2px 7px;
  margin-top: 2px;
}

/* ── Tabs ── */
.tabs {
  display: flex;
  gap: 4px;
  margin-bottom: 16px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 5px;
}

.tab {
  flex: 1;
  padding: 9px 12px;
  text-align: center;
  border-radius: 8px;
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
  color: var(--muted);
  transition: all 0.15s;
  border: none;
  background: transparent;
  font-family: var(--sans);
  white-space: nowrap;
}

.tab:hover { color: var(--text); }
.tab.active {
  background: var(--card);
  color: var(--accent);
  border: 1px solid var(--border2);
  font-weight: 600;
}

/* ── Result panels ── */
.panel { display: none; }
.panel.active { display: block; }

/* info card */
.info-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  overflow: hidden;
  margin-bottom: 16px;
  animation: fadeUp 0.3s ease;
}

@keyframes fadeUp {
  from { opacity:0; transform:translateY(8px); }
  to { opacity:1; transform:translateY(0); }
}

.info-card-head {
  background: var(--card);
  border-bottom: 1px solid var(--border);
  padding: 14px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  flex-wrap: wrap;
}

.info-card-title {
  font-size: 14px;
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: 8px;
}

.info-card-body {
  padding: 20px;
}

/* kv grid */
.kv-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 14px;
}

.kv-item {}
.kv-label {
  font-size: 10px;
  color: var(--muted);
  font-family: var(--mono);
  letter-spacing: 0.5px;
  margin-bottom: 4px;
}
.kv-value {
  font-size: 14px;
  font-weight: 500;
  color: var(--text);
  word-break: keep-all;
}
.kv-value.big {
  font-size: 22px;
  font-weight: 700;
  color: var(--accent);
}

/* badge */
.tag {
  display: inline-block;
  padding: 3px 10px;
  border-radius: 20px;
  font-size: 11px;
  font-weight: 600;
}
.tag-blue { background: rgba(79,156,249,0.15); color: var(--accent); }
.tag-green { background: rgba(110,231,183,0.12); color: var(--accent2); }
.tag-amber { background: rgba(245,158,11,0.12); color: var(--accent3); }
.tag-red { background: rgba(248,113,113,0.12); color: var(--red); }

/* table */
.tbl-wrap { overflow-x: auto; }
.tbl {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
}
.tbl th {
  background: var(--card);
  padding: 10px 12px;
  text-align: left;
  font-size: 11px;
  font-family: var(--mono);
  color: var(--muted);
  border-bottom: 1px solid var(--border);
  white-space: nowrap;
}
.tbl td {
  padding: 10px 12px;
  border-bottom: 1px solid var(--border);
  vertical-align: middle;
}
.tbl tr:last-child td { border-bottom: none; }
.tbl tr:hover td { background: rgba(255,255,255,0.02); }
.mono { font-family: var(--mono); font-size: 12px; }

/* divider */
.divider {
  height: 1px;
  background: var(--border);
  margin: 16px 0;
}

/* loading */
.loading {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 60px 20px;
  gap: 14px;
  color: var(--muted);
  font-size: 13px;
  font-family: var(--mono);
}
.spinner {
  width: 30px; height: 30px;
  border: 2px solid var(--border2);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* empty */
.empty {
  text-align: center;
  padding: 60px 20px;
  color: var(--muted);
}
.empty .icon { font-size: 40px; margin-bottom: 14px; }
.empty p { font-size: 13px; line-height: 1.7; }

/* error */
.err-box {
  background: rgba(248,113,113,0.08);
  border: 1px solid rgba(248,113,113,0.2);
  border-radius: 10px;
  padding: 16px 18px;
  color: var(--red);
  font-size: 13px;
  display: flex;
  gap: 10px;
  align-items: flex-start;
}

/* address chip */
.addr-chip {
  background: rgba(79,156,249,0.1);
  border: 1px solid rgba(79,156,249,0.2);
  border-radius: 8px;
  padding: 10px 16px;
  font-size: 13px;
  color: var(--accent);
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 16px;
  font-family: var(--mono);
}

@media (max-width: 600px) {
  .search-row { flex-wrap: wrap; }
  .tab { font-size: 11px; padding: 8px 6px; }
}
</style>
</head>
<body>
<div class="wrap">

  <!-- Header -->
  <div class="header">
    <div class="header-top">
      <div class="header-icon">🏢</div>
      <h1>건축물대장 조회</h1>
    </div>
    <div class="header-sub">국토교통부 건축HUB · apis.data.go.kr/1613000/BldRgstHubService</div>
  </div>

  <!-- Search -->
  <div class="search-card">
    <div class="search-label">// 주소 검색</div>
    <div class="search-row">
      <input class="search-input" id="addrInput"
        placeholder="도로명 또는 지번 주소 입력 (예: 서울 강남구 테헤란로 152)"
        onkeydown="if(event.key==='Enter') searchAddress()">
      <button class="btn btn-primary" id="searchBtn" onclick="searchAddress()">🔍 검색</button>
      <button class="btn btn-ghost" onclick="reset()">초기화</button>
    </div>
    <div id="addrList"></div>
  </div>

  <!-- Address chip -->
  <div id="addrChip" style="display:none"></div>

  <!-- Tabs -->
  <div id="tabsWrap" style="display:none">
    <div class="tabs">
      <button class="tab active" onclick="switchTab('title')" id="tab-title">📋 표제부</button>
      <button class="tab" onclick="switchTab('recap')" id="tab-recap">🏗 총괄표제부</button>
      <button class="tab" onclick="switchTab('floor')" id="tab-floor">📐 층별개요</button>
      <button class="tab" onclick="switchTab('area')" id="tab-area">📏 전유공용면적</button>
      <button class="tab" onclick="switchTab('land')" id="tab-land">🗺 지역지구구역</button>
    </div>
    <div id="panel-title" class="panel active"></div>
    <div id="panel-recap" class="panel"></div>
    <div id="panel-floor" class="panel"></div>
    <div id="panel-area" class="panel"></div>
    <div id="panel-land" class="panel"></div>
  </div>

</div>

<script>
const SERVICE_KEY = "dc8294cd0177c5d51b45be29652fb691c4b18e055f22c87b0967ca1a78c7df0a";
const JUSO_KEY   = "devU01TX0FVVEgyMDI0MTEyMTE3MjMyNzExNTI1MzQ="; // 도로명주소 개발용 키
const BASE_URL   = "https://apis.data.go.kr/1613000/BldRgstHubService";

let currentAddr = null; // { sigunguCd, bjdongCd, platGbCd, bun, ji, label }
let cache = {};

/* ── 주소 검색 ── */
async function searchAddress() {
  const q = document.getElementById('addrInput').value.trim();
  if (!q) return;

  document.getElementById('addrList').innerHTML = `
    <div style="padding:14px;color:var(--muted);font-size:13px;font-family:var(--mono)">
      <span style="animation:spin 0.7s linear infinite;display:inline-block;margin-right:8px">⟳</span>주소 검색 중...
    </div>`;

  try {
    const url = `https://business.juso.go.kr/addrlink/addrLinkApi.do?confmKey=${JUSO_KEY}&currentPage=1&countPerPage=10&keyword=${encodeURIComponent(q)}&resultType=json`;
    const res = await fetch(url);
    const json = await res.json();
    const juso = json?.results?.juso || [];

    if (juso.length === 0) {
      document.getElementById('addrList').innerHTML =
        `<div style="padding:12px;color:var(--muted);font-size:13px">검색 결과가 없습니다.</div>`;
      return;
    }

    const html = juso.map(j => `
      <div class="addr-item" onclick='selectAddress(${JSON.stringify({
        sigunguCd: j.admCd.slice(0,5),
        bjdongCd:  j.admCd.slice(5,10),
        platGbCd:  j.mtYn === "1" ? "1" : "0",
        bun:       j.lnbrMnnm.padStart(4,'0'),
        ji:        j.lnbrSlno.padStart(4,'0'),
        road:      j.roadAddr,
        jibun:     j.jibunAddr,
        bdNm:      j.bdNm,
      })})'>
        <span class="addr-badge">${j.bdKdcd==="1"?"공동주택":"일반"}</span>
        <div>
          <div class="addr-road">${j.roadAddr}${j.bdNm?` <span style="color:var(--accent3)">(${j.bdNm})</span>`:''}</div>
          <div class="addr-jibun">지번: ${j.jibunAddr}</div>
        </div>
      </div>
    `).join('');

    document.getElementById('addrList').innerHTML =
      `<div class="addr-list">${html}</div>`;

  } catch(e) {
    document.getElementById('addrList').innerHTML =
      `<div class="err-box">⚠️ 주소 검색 오류: ${e.message}</div>`;
  }
}

/* ── 주소 선택 → 건축물대장 조회 ── */
async function selectAddress(info) {
  currentAddr = info;
  cache = {};

  document.getElementById('addrList').innerHTML = '';
  document.getElementById('addrInput').value = info.road;

  // chip
  document.getElementById('addrChip').style.display = 'flex';
  document.getElementById('addrChip').innerHTML =
    `<span>📍</span> <b>${info.road}</b>&nbsp;&nbsp;<span style="color:var(--muted)">${info.jibun}</span>`;

  document.getElementById('tabsWrap').style.display = 'block';

  // activate first tab
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.getElementById('tab-title').classList.add('active');
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  document.getElementById('panel-title').classList.add('active');

  await loadPanel('title');
}

/* ── Tab switch ── */
async function switchTab(name) {
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  document.getElementById('tab-'+name).classList.add('active');
  document.getElementById('panel-'+name).classList.add('active');
  await loadPanel(name);
}

/* ── Load panel ── */
async function loadPanel(name) {
  if (cache[name]) return; // already loaded
  const el = document.getElementById('panel-'+name);

  const ops = {
    title: 'getBrTitleInfo',
    recap: 'getBrRecapTitleInfo',
    floor: 'getBrFlrOulnInfo',
    area:  'getBrExposPubuseAreaInfo',
    land:  'getBrJijiguInfo',
  };

  const op = ops[name];
  if (!op) return;

  el.innerHTML = `<div class="loading"><div class="spinner"></div><span>${op} 조회 중...</span></div>`;

  try {
    const {sigunguCd,bjdongCd,platGbCd,bun,ji} = currentAddr;
    const params = new URLSearchParams({
      serviceKey: SERVICE_KEY,
      sigunguCd, bjdongCd, platGbCd, bun, ji,
      _type: 'json',
      numOfRows: 100,
      pageNo: 1,
    });

    const res = await fetch(`${BASE_URL}/${op}?${params}`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const json = await res.json();

    // Handle response structure
    const body = json?.response?.body;
    if (!body) throw new Error('응답 형식 오류');
    if (body.totalCount === 0) {
      el.innerHTML = `<div class="empty"><div class="icon">📭</div><p>해당 주소의 ${name} 정보가 없습니다.</p></div>`;
      cache[name] = true;
      return;
    }

    const items = [].concat(body.items?.item || []);
    cache[name] = true;

    // Render by type
    const renderers = { title: renderTitle, recap: renderRecap, floor: renderFloor, area: renderArea, land: renderLand };
    el.innerHTML = '';
    renderers[name](el, items);

  } catch(e) {
    el.innerHTML = `<div class="err-box">⚠️ <div><b>API 오류</b><br>${e.message}<br><small style="opacity:.7">인증키 또는 네트워크를 확인하거나, 해당 주소에 데이터가 없을 수 있습니다.</small></div></div>`;
  }
}

/* ── Renderers ── */

function val(v) { return (v === undefined || v === null || v === '') ? '—' : v; }
function fmtDate(d) { return d ? String(d).replace(/(\d{4})(\d{2})(\d{2})/,'$1-$2-$3') : '—'; }
function fmtNum(n) { return n ? Number(n).toLocaleString() : '—'; }

function renderTitle(el, items) {
  items.forEach((it, i) => {
    const card = document.createElement('div');
    card.className = 'info-card';
    card.innerHTML = `
      <div class="info-card-head">
        <div class="info-card-title">
          🏠 ${val(it.bldNm) !== '—' ? it.bldNm : '건물 ' + (i+1)}
          <span class="tag tag-blue">${val(it.mainPurpsCdNm)}</span>
        </div>
        <span class="tag tag-green">${val(it.strctCdNm)}</span>
      </div>
      <div class="info-card-body">
        <div class="kv-grid">
          <div class="kv-item"><div class="kv-label">대지위치</div><div class="kv-value">${val(it.platPlc)}</div></div>
          <div class="kv-item"><div class="kv-label">도로명주소</div><div class="kv-value">${val(it.newPlatPlc)}</div></div>
          <div class="kv-item"><div class="kv-label">대지면적</div><div class="kv-value">${fmtNum(it.platArea)} ㎡</div></div>
          <div class="kv-item"><div class="kv-label">건축면적</div><div class="kv-value">${fmtNum(it.archArea)} ㎡</div></div>
          <div class="kv-item"><div class="kv-label">연면적</div><div class="kv-value">${fmtNum(it.totArea)} ㎡</div></div>
          <div class="kv-item"><div class="kv-label">건폐율</div><div class="kv-value">${val(it.bcRat)} %</div></div>
          <div class="kv-item"><div class="kv-label">용적률</div><div class="kv-value">${val(it.vlRat)} %</div></div>
          <div class="kv-item"><div class="kv-label">지상층수</div><div class="kv-value">${val(it.grndFlrCnt)} 층</div></div>
          <div class="kv-item"><div class="kv-label">지하층수</div><div class="kv-value">${val(it.ugrndFlrCnt)} 층</div></div>
          <div class="kv-item"><div class="kv-label">승강기</div><div class="kv-value">${val(it.rideUseElvtCnt)} 대</div></div>
          <div class="kv-item"><div class="kv-label">총주차수</div><div class="kv-value">${val(it.totPkngCnt)} 대</div></div>
          <div class="kv-item"><div class="kv-label">허가일</div><div class="kv-value">${fmtDate(it.pmsDay)}</div></div>
          <div class="kv-item"><div class="kv-label">착공일</div><div class="kv-value">${fmtDate(it.stcnsDay)}</div></div>
          <div class="kv-item"><div class="kv-label">사용승인일</div><div class="kv-value">${fmtDate(it.useAprDay)}</div></div>
          <div class="kv-item"><div class="kv-label">지붕구조</div><div class="kv-value">${val(it.roofCdNm)}</div></div>
          <div class="kv-item"><div class="kv-label">에너지효율등급</div><div class="kv-value">${val(it.engrGrade)}</div></div>
        </div>
      </div>`;
    el.appendChild(card);
  });
}

function renderRecap(el, items) {
  items.forEach((it) => {
    const card = document.createElement('div');
    card.className = 'info-card';
    card.innerHTML = `
      <div class="info-card-head">
        <div class="info-card-title">🏗 총괄표제부 <span class="tag tag-amber">${val(it.mainPurpsCdNm)}</span></div>
      </div>
      <div class="info-card-body">
        <div class="kv-grid">
          <div class="kv-item"><div class="kv-label">건물명</div><div class="kv-value">${val(it.bldNm)}</div></div>
          <div class="kv-item"><div class="kv-label">대지면적</div><div class="kv-value">${fmtNum(it.platArea)} ㎡</div></div>
          <div class="kv-item"><div class="kv-label">건축면적</div><div class="kv-value">${fmtNum(it.archArea)} ㎡</div></div>
          <div class="kv-item"><div class="kv-label">연면적</div><div class="kv-value">${fmtNum(it.totArea)} ㎡</div></div>
          <div class="kv-item"><div class="kv-label">건폐율</div><div class="kv-value">${val(it.bcRat)} %</div></div>
          <div class="kv-item"><div class="kv-label">용적률</div><div class="kv-value">${val(it.vlRat)} %</div></div>
          <div class="kv-item"><div class="kv-label">세대수</div><div class="kv-value">${fmtNum(it.hhldCnt)} 세대</div></div>
          <div class="kv-item"><div class="kv-label">가구수</div><div class="kv-value">${fmtNum(it.fmlyCnt)} 가구</div></div>
          <div class="kv-item"><div class="kv-label">주건축물수</div><div class="kv-value">${val(it.mainBldCnt)} 동</div></div>
          <div class="kv-item"><div class="kv-label">총주차수</div><div class="kv-value">${val(it.totPkngCnt)} 대</div></div>
          <div class="kv-item"><div class="kv-label">사용승인일</div><div class="kv-value">${fmtDate(it.useAprDay)}</div></div>
          <div class="kv-item"><div class="kv-label">친환경건축물등급</div><div class="kv-value">${val(it.gnBldGrade)}</div></div>
        </div>
      </div>`;
    el.appendChild(card);
  });
}

function renderFloor(el, items) {
  const card = document.createElement('div');
  card.className = 'info-card';

  const rows = items.map(it => `
    <tr>
      <td>${val(it.flrNoNm)}</td>
      <td>${val(it.mainPurpsCdNm)}</td>
      <td>${val(it.strctCdNm)}</td>
      <td class="mono">${fmtNum(it.area)}</td>
    </tr>`).join('');

  card.innerHTML = `
    <div class="info-card-head">
      <div class="info-card-title">📐 층별개요</div>
      <span class="tag tag-blue">총 ${items.length}건</span>
    </div>
    <div class="tbl-wrap">
      <table class="tbl">
        <thead><tr><th>층</th><th>주용도</th><th>구조</th><th>면적(㎡)</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;
  el.appendChild(card);
}

/* ── Misc ── */
function switchTab(name) {
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  document.getElementById('tab-'+name).classList.add('active');
  document.getElementById('panel-'+name).classList.add('active');
  loadPanel(name);
}

function reset() {
  currentAddr = null;
  cache = {};
  document.getElementById('addrInput').value = '';
  document.getElementById('addrList').innerHTML = '';
  document.getElementById('addrChip').style.display = 'none';
  document.getElementById('tabsWrap').style.display = 'none';
  document.querySelectorAll('.panel').forEach(p=>p.innerHTML='');
}
</script>
