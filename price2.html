<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>공동주택 공시가격 조회</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700;900&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d1117;
    --surface: #161b22;
    --surface2: #1c2128;
    --border: #30363d;
    --text: #e6edf3;
    --muted: #7d8590;
    --accent: #58a6ff;
    --accent2: #3fb950;
    --warn: #f78166;
    --gold: #d29922;
    --grad1: #58a6ff;
    --grad2: #bc8cff;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans KR', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Animated background */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 80% 50% at 20% -10%, rgba(88,166,255,0.08) 0%, transparent 60%),
      radial-gradient(ellipse 60% 40% at 80% 110%, rgba(188,140,255,0.06) 0%, transparent 60%);
    pointer-events: none;
    z-index: 0;
  }

  header {
    position: relative;
    z-index: 1;
    padding: 24px 40px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 12px;
    background: rgba(13,17,23,0.8);
    backdrop-filter: blur(12px);
  }

  .logo-mark {
    width: 32px;
    height: 32px;
    background: linear-gradient(135deg, var(--grad1), var(--grad2));
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    flex-shrink: 0;
  }

  .logo-text {
    font-family: 'Noto Serif KR', serif;
    font-size: 17px;
    font-weight: 700;
    background: linear-gradient(90deg, var(--grad1), var(--grad2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .badge {
    margin-left: auto;
    font-size: 10px;
    color: var(--accent2);
    border: 1px solid rgba(63,185,80,0.3);
    background: rgba(63,185,80,0.08);
    padding: 3px 10px;
    border-radius: 20px;
    letter-spacing: 0.05em;
  }

  main {
    position: relative;
    z-index: 1;
    max-width: 760px;
    margin: 0 auto;
    padding: 56px 24px 80px;
  }

  .hero {
    text-align: center;
    margin-bottom: 52px;
    animation: fadeUp 0.6s ease both;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .hero-eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    color: var(--accent);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    font-weight: 500;
    margin-bottom: 16px;
    padding: 4px 14px;
    border: 1px solid rgba(88,166,255,0.3);
    border-radius: 20px;
    background: rgba(88,166,255,0.06);
  }

  .hero h1 {
    font-family: 'Noto Serif KR', serif;
    font-size: clamp(28px, 5vw, 40px);
    font-weight: 900;
    line-height: 1.25;
    letter-spacing: -0.02em;
    margin-bottom: 14px;
  }

  .hero h1 .highlight {
    background: linear-gradient(90deg, var(--grad1), var(--grad2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .hero p {
    color: var(--muted);
    font-size: 14px;
    font-weight: 300;
    line-height: 1.8;
  }

  /* Search card */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 32px;
    margin-bottom: 24px;
    animation: fadeUp 0.6s ease 0.1s both;
  }

  .card-title {
    font-size: 12px;
    font-weight: 500;
    color: var(--muted);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .card-title::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  .form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
    margin-bottom: 20px;
  }

  .form-group { display: flex; flex-direction: column; gap: 6px; }
  .form-group.full { grid-column: 1 / -1; }

  label {
    font-size: 11px;
    font-weight: 500;
    color: var(--muted);
    letter-spacing: 0.06em;
  }

  input, select {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px 14px;
    font-size: 14px;
    font-family: 'Noto Sans KR', sans-serif;
    border-radius: 8px;
    transition: border-color 0.2s, box-shadow 0.2s;
    outline: none;
    -webkit-appearance: none;
  }

  input::placeholder { color: var(--muted); opacity: 0.6; }

  input:focus, select:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(88,166,255,0.12);
  }

  select option { background: var(--surface); }

  .btn {
    width: 100%;
    padding: 14px;
    background: linear-gradient(135deg, #1f6feb, #8957e5);
    color: white;
    border: none;
    border-radius: 8px;
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: opacity 0.2s, transform 0.15s, box-shadow 0.2s;
    letter-spacing: 0.02em;
    position: relative;
    overflow: hidden;
  }

  .btn::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(255,255,255,0.15), transparent);
    opacity: 0;
    transition: opacity 0.2s;
  }

  .btn:hover::before { opacity: 1; }
  .btn:hover { box-shadow: 0 4px 20px rgba(31,111,235,0.4); }
  .btn:active { transform: scale(0.99); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

  /* Loading */
  .loading-wrap {
    text-align: center;
    padding: 56px 24px;
    animation: fadeUp 0.4s ease;
  }

  .loading-ring {
    width: 48px;
    height: 48px;
    border: 3px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.9s linear infinite;
    margin: 0 auto 20px;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .loading-text {
    color: var(--muted);
    font-size: 14px;
    line-height: 1.7;
  }

  .loading-dots span {
    display: inline-block;
    animation: blink 1.2s ease infinite;
  }
  .loading-dots span:nth-child(2) { animation-delay: 0.2s; }
  .loading-dots span:nth-child(3) { animation-delay: 0.4s; }

  @keyframes blink {
    0%, 80%, 100% { opacity: 0; }
    40% { opacity: 1; }
  }

  /* Result */
  .result-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    animation: fadeUp 0.5s ease;
  }

  .result-header {
    padding: 20px 24px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--surface2);
  }

  .result-addr {
    font-size: 13px;
    color: var(--muted);
  }

  .result-addr strong { color: var(--text); font-weight: 500; }

  .result-year {
    font-size: 11px;
    background: rgba(88,166,255,0.12);
    color: var(--accent);
    border: 1px solid rgba(88,166,255,0.25);
    padding: 3px 10px;
    border-radius: 20px;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }

  thead { background: rgba(255,255,255,0.03); }

  th {
    padding: 12px 20px;
    text-align: left;
    font-size: 10px;
    font-weight: 600;
    color: var(--muted);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }

  td {
    padding: 14px 20px;
    border-bottom: 1px solid rgba(48,54,61,0.6);
    color: var(--text);
    white-space: nowrap;
  }

  tr:last-child td { border-bottom: none; }

  tbody tr {
    transition: background 0.15s;
  }

  tbody tr:hover { background: rgba(255,255,255,0.03); }

  .price-val {
    font-family: 'Noto Serif KR', serif;
    font-weight: 700;
    font-size: 15px;
    color: var(--accent2);
  }

  .area-val {
    color: var(--accent);
    font-weight: 500;
  }

  .tag {
    display: inline-block;
    font-size: 10px;
    padding: 2px 8px;
    border-radius: 4px;
    background: rgba(88,166,255,0.1);
    color: var(--accent);
    border: 1px solid rgba(88,166,255,0.2);
  }

  /* Notice */
  .notice {
    padding: 16px 20px;
    border-radius: 8px;
    font-size: 13px;
    line-height: 1.7;
    margin-top: 16px;
    animation: fadeUp 0.4s ease;
  }

  .notice.error {
    background: rgba(247,129,102,0.08);
    border: 1px solid rgba(247,129,102,0.25);
    color: var(--warn);
  }

  .notice.info {
    background: rgba(63,185,80,0.08);
    border: 1px solid rgba(63,185,80,0.2);
    color: var(--accent2);
    margin-top: 0;
    margin-bottom: 24px;
  }

  .notice.warn {
    background: rgba(210,153,34,0.08);
    border: 1px solid rgba(210,153,34,0.25);
    color: var(--gold);
  }

  /* Footer note */
  .footnote {
    text-align: center;
    font-size: 11px;
    color: var(--muted);
    margin-top: 32px;
    line-height: 1.8;
    opacity: 0.7;
  }

  .footnote a { color: var(--accent); text-decoration: none; }

  @media (max-width: 480px) {
    .form-grid { grid-template-columns: 1fr; }
    header { padding: 16px 20px; }
    main { padding: 32px 16px 60px; }
    .card { padding: 20px; }
    td, th { padding: 10px 14px; }
  }
</style>
</head>
<body>

<header>
  <div class="logo-mark">🏠</div>
  <span class="logo-text">공동주택 공시가격 조회</span>
  <span class="badge">✦ AI 기반</span>
</header>

<main>
  <div class="hero">
    <div class="hero-eyebrow">✦ AI Powered</div>
    <h1>공동주택 <span class="highlight">공시가격</span> 조회</h1>
    <p>주소를 입력하면 AI가 공시가격 및 전용면적 정보를 분석해드립니다.<br>별도 API 키 없이 바로 사용 가능합니다.</p>
  </div>

  <div class="notice info">
    ✅ 이 앱은 Claude AI를 활용합니다. API 키나 별도 설치 없이 브라우저에서 바로 사용 가능합니다.
  </div>

  <div class="card">
    <div class="card-title">📍 주소 입력</div>
    <div class="form-grid">
      <div class="form-group">
        <label>시도</label>
        <input type="text" id="sido" placeholder="예: 경기도" />
      </div>
      <div class="form-group">
        <label>시군구</label>
        <input type="text" id="sigungu" placeholder="예: 성남시중원구" />
      </div>
      <div class="form-group">
        <label>법정동</label>
        <input type="text" id="dong" placeholder="예: 금광동" />
      </div>
      <div class="form-group">
        <label>번지 (선택)</label>
        <input type="text" id="bun" placeholder="예: 2600" />
      </div>
      <div class="form-group">
        <label>단지명 (선택)</label>
        <input type="text" id="danji" placeholder="예: 래미안" />
      </div>
      <div class="form-group">
        <label>기준연도</label>
        <select id="year">
          <option value="2025" selected>2025년</option>
          <option value="2024">2024년</option>
          <option value="2023">2023년</option>
          <option value="2022">2022년</option>
        </select>
      </div>
    </div>
    <button class="btn" id="searchBtn" onclick="search()">🔍 공시가격 조회하기</button>
  </div>

  <div id="result"></div>

  <div class="footnote">
    AI가 제공하는 정보는 참고용입니다. 정확한 공식 정보는
    <a href="https://www.realtyprice.kr" target="_blank">realtyprice.kr</a>에서 확인하세요.
  </div>
</main>

<script>
async function search() {
  const sido = document.getElementById('sido').value.trim();
  const sigungu = document.getElementById('sigungu').value.trim();
  const dong = document.getElementById('dong').value.trim();
  const bun = document.getElementById('bun').value.trim();
  const danji = document.getElementById('danji').value.trim();
  const year = document.getElementById('year').value;
  const btn = document.getElementById('searchBtn');
  const resultEl = document.getElementById('result');

  if (!sido || !sigungu || !dong) {
    resultEl.innerHTML = `<div class="notice error">⚠️ 시도, 시군구, 법정동은 필수 입력 항목입니다.</div>`;
    return;
  }

  btn.disabled = true;
  resultEl.innerHTML = `
    <div class="loading-wrap">
      <div class="loading-ring"></div>
      <div class="loading-text">
        AI가 공시가격 정보를 분석하고 있습니다<br>
        <span class="loading-dots">
          <span>.</span><span>.</span><span>.</span>
        </span>
      </div>
    </div>
  `;

  const address = [sido, sigungu, dong, bun, danji].filter(Boolean).join(' ');

  const prompt = `당신은 대한민국 부동산 공동주택 공시가격 전문가입니다.

사용자가 요청한 주소의 ${year}년 기준 공동주택 공시가격 및 전용면적 정보를 제공해주세요.

요청 주소: ${address}

다음 JSON 형식으로만 응답하세요. 다른 텍스트나 마크다운 없이 순수 JSON만 출력하세요.

{
  "address": "조회한 전체 주소",
  "year": "${year}",
  "note": "간단한 안내 메시지 (1-2문장, 해당 지역 특성 포함)",
  "items": [
    {
      "complexName": "단지명",
      "dong": "동",
      "ho": "호수",
      "area": "전용면적(숫자만, 예: 84.99)",
      "price": "공동주택가격(원 단위 숫자만, 예: 450000000)",
      "floor": "층수"
    }
  ]
}

중요 지침:
1. 해당 주소의 실제 공동주택 단지 정보를 기반으로 응답하세요.
2. 번지나 단지명이 입력된 경우 해당 단지에 맞는 정보를 제공하세요.
3. 전용면적 유형별(예: 59㎡, 84㎡, 115㎡ 등)로 대표 사례를 3~8개 정도 제공하세요.
4. 공시가격은 ${year}년 기준 실제 공시가격에 근접한 값으로 제공하세요.
5. 해당 주소에 공동주택이 없거나 정보가 불분명한 경우 items를 빈 배열로 하고 note에 이유를 설명하세요.
6. 단지명이 입력된 경우 해당 단지의 정보만 제공하세요.`;

  try {
    const res = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "claude-sonnet-4-20250514",
        max_tokens: 1000,
        messages: [{ role: "user", content: prompt }]
      })
    });

    if (!res.ok) throw new Error(`API 오류: ${res.status}`);

    const data = await res.json();
    const raw = data.content.map(b => b.text || '').join('');
    const clean = raw.replace(/```json|```/g, '').trim();
    const parsed = JSON.parse(clean);

    renderResult(parsed, year);
  } catch (err) {
    console.error(err);
    resultEl.innerHTML = `
      <div class="notice error">
        ⚠️ 조회 중 오류가 발생했습니다: ${err.message}<br><br>
        잠시 후 다시 시도해주세요.
      </div>
    `;
  } finally {
    btn.disabled = false;
  }
}

function renderResult(data, year) {
  const el = document.getElementById('result');

  if (!data.items || data.items.length === 0) {
    el.innerHTML = `
      <div class="notice warn">⚠️ ${data.note || '해당 주소에서 공동주택 정보를 찾을 수 없습니다.'}</div>
    `;
    return;
  }

  const rows = data.items.map(item => `
    <tr>
      <td>${item.complexName || '-'}</td>
      <td>${item.dong || '-'}</td>
      <td>${item.ho || '-'}</td>
      <td>${item.floor || '-'}층</td>
      <td class="area-val">${parseFloat(item.area || 0).toFixed(2)} ㎡</td>
      <td class="price-val">${formatPrice(item.price)}</td>
    </tr>
  `).join('');

  el.innerHTML = `
    <div class="result-card">
      <div class="result-header">
        <div class="result-addr">
          🏠 <strong>${data.address || ''}</strong>
          ${data.note ? `<br><span style="font-size:12px;opacity:0.8">${data.note}</span>` : ''}
        </div>
        <span class="result-year">${year}년 기준</span>
      </div>
      <div style="overflow-x:auto">
        <table>
          <thead>
            <tr>
              <th>단지명</th>
              <th>동</th>
              <th>호수</th>
              <th>층수</th>
              <th>전용면적</th>
              <th>공동주택가격</th>
            </tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
      <div style="padding:14px 20px; border-top:1px solid var(--border); font-size:11px; color:var(--muted); line-height:1.7">
        ⚠️ AI가 제공하는 정보는 참고용입니다. 정확한 공식 공시가격은 
        <a href="https://www.realtyprice.kr" target="_blank" style="color:var(--accent)">realtyprice.kr</a>에서 확인하세요.
        공시가격은 매년 1월 1일 기준으로 산정됩니다.
      </div>
    </div>
  `;
}

function formatPrice(val) {
  if (!val) return '-';
  const n = parseInt(String(val).replace(/[^0-9]/g, ''));
  if (isNaN(n)) return val;
  if (n >= 100000000) {
    const eok = Math.floor(n / 100000000);
    const man = Math.floor((n % 100000000) / 10000);
    return man > 0 ? `${eok}억 ${man.toLocaleString()}만원` : `${eok}억원`;
  }
  return `${Math.floor(n / 10000).toLocaleString()}만원`;
}

document.addEventListener('keydown', e => {
  if (e.key === 'Enter') search();
});
</script>
</body>
</html>
